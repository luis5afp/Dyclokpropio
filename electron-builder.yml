appId: com.dyclokpropio.desktop
productName: Dyclokpropio
artifactName: Dyclokpropio_${version}_${os}_${arch}.${ext}
asar: true
# The wrapped Electron entry loads the original runtime unchanged, and injects
# the local Cookies Pro Privada extension into Chromium launches from Node.
extraMetadata:
  main: src/main/bundled-extension-bootstrap.js
asarUnpack:
  - dist-electron/worker/**
  - dist/assets/sync/**
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - src/main/bundled-extension-bootstrap.js
  - src/main/bundled-extension-launch.js
  - src/main/bundled-extension-pin.js
  - src/main/bundled-extension-download-retry.js
  - src/main/extension-download-diagnostics.js
  - package.json
  - node_modules/**/*
extraResources:
  - from: plugins
    to: plugins
  - from: vendor
    to: vendor
  - from: tools/repair-extension-cache.ps1
    to: tools/repair-extension-cache.ps1
  - from: resources/electron
    to: electron
  - from: resources/elevate.exe
    to: elevate.exe
win:
  icon: application.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

name: Verify gated local release script v30.0.14

on:
  push:
    branches:
      - feature/v30-0-14-rc4-chromium-completo-20261026
    paths:
      - 'tools/build-and-publish-v30-0-14.ps1'
      - '.github/workflows/verify-v30-0-14-release-script.yml'

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows PowerShell release script parses and uses explicit approval
        shell: powershell
        run: |
          $src=Get-Content -LiteralPath tools/build-and-publish-v30-0-14.ps1 -Raw
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseInput($src,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -gt 0){foreach($e in $errors){Write-Host $e.Message};throw 'Release PS1 parsing error'}
          foreach($required in @('TengoPermisoRedistribucion','build-win-with-complete-chromium.ps1',
            'Get-FileHash','completeChromiumBundled=true','nativeCacheIpcRegistered=true',
            'gh release create v30.0.14','--prerelease')){
            if(-not $src.Contains($required)){throw ('Missing approval or integrity gate: '+$required)}
          }
          Write-Host 'PASS: PS1 syntax and explicit redistribution, SHA256 and native IPC gates'

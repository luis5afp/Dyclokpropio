name: Dyclokpro v6.3 - Inspector local de perfiles

on:
  push:
    branches: ['release/v6.3-profile-data-inspector']
    paths:
      - '.github/workflows/publish-v6-3-profile-inspector.yml'
      - 'tools/release-v6-3-inspector.py'
      - 'release-build/v6.3/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dyclokpro-v6-3-profile-inspector
  cancel-in-progress: false

jobs:
  build-publish:
    if: github.repository == 'luis5afp/Dyclokpropio'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout v6.3 inspector source
        uses: actions/checkout@v4

      - name: Prevent overwriting any existing v6.3 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $list=@(& gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'Failed to check existing releases'}
          if(@($list | Where-Object {$_.tagName -eq 'v6.3'}).Count -gt 0){
            throw 'v6.3 already exists, refusing to overwrite it'
          }

      - name: Download published Windows v6.2 as the exact reproducible base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh release download 'v6.2' --repo $env:GITHUB_REPOSITORY --pattern 'Dyclokpro_6.2_win_x64.exe' --dir $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){throw 'Could not download v6.2 full installer'}
          $exe=Join-Path $env:RUNNER_TEMP 'Dyclokpro_6.2_win_x64.exe'
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'Missing original v6.2 EXE'}
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          if($hash -ne '03c815d003cd12b0028f01d02d6fa4fb38bcd9a59cb6ca4d6a435482584154cc'){
            throw 'BLOCKED: v6.2 original SHA256 mismatch'
          }

      - name: Embed inspector in Electron and validate ASAR integrity
        shell: pwsh
        run: |
          $exe=Join-Path $env:RUNNER_TEMP 'Dyclokpro_6.2_win_x64.exe'
          $dest=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-3-prepackaged'
          & python tools/release-v6-3-inspector.py --installer $exe --destination $dest --inspector release-build/v6.3/inspector.js
          if($LASTEXITCODE -ne 0){throw 'BLOCKED: cannot verify Electron resources or inspector patch'}
          $tests=@('DICloak.exe','Dyclokpro_Perfiles_Locales.exe','Chromium/Application/ginsbrowser.exe','Chromium/Application/142.0.7444.273/chrome.dll','resources/app.asar.unpacked/dist/dyclokpro-inspector.js')
          foreach($item in $tests){
            if(-not(Test-Path -LiteralPath (Join-Path $dest $item) -PathType Leaf)){
              throw "BLOCKED: required program component not packaged: $item"
            }
          }
          Copy-Item -LiteralPath (Join-Path $dest 'Dyclokpro.ico') -Destination 'release-build/v6.3/Dyclokpro.ico' -Force

      - name: Compile installable Windows x64 NSIS v6.3 EXE
        shell: pwsh
        working-directory: release-build/v6.3
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          & npm install --no-fund --no-audit --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'NSIS dependency installation failed'}
          $app=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-3-prepackaged'
          & npx electron-builder --win nsis --x64 --prepackaged $app --publish never --config electron-builder.json
          if($LASTEXITCODE -ne 0){throw 'Windows NSIS EXE build failed'}
          $exe='out/Dyclokpro_6.3_win_x64.exe'
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'Built EXE not found'}
          $bytes=(Get-Item $exe).Length
          if($bytes -lt 180000000){throw "Windows installer too small: $bytes"}
          $hash=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  Dyclokpro_6.3_win_x64.exe" | Set-Content 'out/SHA256SUMS_v6.3.txt' -Encoding ascii
          Write-Host "DYCLOKPRO_V6_3_EXE_SIZE=$bytes"
          Write-Host "DYCLOKPRO_V6_3_SHA256=$hash"

      - name: Validate and publish brand-new v6.3 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='release-build/v6.3/out/Dyclokpro_6.3_win_x64.exe'
          $checksum='release-build/v6.3/out/SHA256SUMS_v6.3.txt'
          $sha=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if((Get-Content $checksum -Raw).Trim() -ne "$sha  Dyclokpro_6.3_win_x64.exe"){
            throw 'Failed to verify installer SHA256SUMS'
          }
          $file=[System.IO.File]::OpenRead((Resolve-Path $exe).Path)
          try {
            $magic=New-Object byte[] 2
            if($file.Read($magic,0,2) -ne 2 -or $magic[0] -ne 77 -or $magic[1] -ne 90){
              throw 'Not a Windows PE executable'
            }
          }finally{$file.Dispose()}
          & 7z l $exe | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Windows NSIS archive structure invalid'}
          $notes=@'
          # Dyclokpro v6.3 — Inspector de datos de perfil

          Instalador completo Windows x64, reconstruido desde el v6.2 original verificado.

          - Nuevo boton **Datos de perfil · Cookies / Proxy** en la esquina inferior izquierda de la ventana principal.
          - Panel con pestanas de Cookies, Proxy, Configuracion y Respuestas del servidor.
          - El panel observa solo solicitudes HTTP fetch/XHR de la interfaz Dyclokpro desde el inicio de la ventana.
          - Las cookies muestran nombre, dominio, ruta y banderas cuando la respuesta contiene esos metadatos.
          - Proxy muestra protocolo, host/puerto y si tiene autenticacion, cuando estan disponibles.
          - No se capturan ni muestran valores de cookies, contrasenas, tokens o respuestas completas.
          - La inspeccion es temporal, no se envia telemetria ni se escribe un registro de secretos.
          - NO intercepta el trafico privado de ginsbrowser.exe ni lee sus archivos de cookies.
          - No garantiza asociar respuestas con un perfil determinado. Las respuestas cifradas o generadas por otros procesos no se pueden inspeccionar.
          - Se conserva el programa gestor de perfiles locales de v6.2 y el Chromium empaquetado.
          - Sin cambios en permisos del servidor ni en bloqueo remoto; comprobacion automatica de versiones sigue desactivada.

          **Validacion:** compilacion JS, integridad de app.asar y su mapa de recursos, presencia de Chromium y ejecutables,
          comprobacion de formato NSIS y SHA256 correctos. La interaccion grafica y datos reales deben verificarse en PC.
          Antes de instalar haz respaldo de tus perfiles.
          '@
          & gh release create 'v6.3' $exe $checksum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Dyclokpro v6.3 - Datos de perfil' --notes $notes --latest
          if($LASTEXITCODE -ne 0){throw 'GitHub v6.3 Release publication failed'}
          Write-Host 'DYCLOKPRO_V6_3_RELEASE_PUBLISHED=true'

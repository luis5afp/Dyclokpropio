name: DyclokPRO v6.9 - Cuentas rapidas y botones completos

on:
  push:
    branches:
      - 'release/v6.9-fast-user-tabs'
    paths:
      - '.github/workflows/publish-v6-9-fast-user-tabs.yml'
      - 'release-build/v6.9/**'
      - 'tools/release-v6-9-user-tabs.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dyclokpro-v6-9-fast-users
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.repository == 'luis5afp/Dyclokpropio'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout verified user-tabs source
        uses: actions/checkout@v4

      - name: Refuse overwriting any published v6.7
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versions=@(& gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'Cannot enumerate existing releases'}
          if(@($versions | Where-Object {$_.tagName -eq 'v6.9'}).Count -gt 0){
            throw 'BLOCKED: immutable v6.9 release already exists'
          }

      - name: Download full v6.7 Windows EXE and verify SHA256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh release download v6.8 --repo $env:GITHUB_REPOSITORY --pattern 'DyclokPRO_6.8_win_x64.exe' --dir $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){throw 'Missing original v6.8 published installer'}
          $file=Join-Path $env:RUNNER_TEMP 'DyclokPRO_6.8_win_x64.exe'
          $hash=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '9d554b0997f944b560415f6865b89ca7d688fba9024d3cf091e7cac1aa37c2b6'){
            throw 'BLOCKED: base installer integrity differs'
          }

      - name: Validate fast account focus, DIC authenticated names and full tab hitboxes
        shell: pwsh
        run: |
          & node --check 'release-build/v6.9/main-account-prelude.js'
          if($LASTEXITCODE -ne 0){throw 'Invalid Electron multiaccount main startup'}
          & node --check 'release-build/v6.9/user-tabs.js'
          if($LASTEXITCODE -ne 0){throw 'Invalid account tab JavaScript'}
          $main=Get-Content 'release-build/v6.9/main-account-prelude.js' -Raw
          foreach($item in @('app.setPath("userData"','app.setPath("sessionData"',
            'focusRunningAccount','focusOwnWindow','runningPath','dyclokpro:users:add',
            'dyclokpro:users:open','logoutCurrent','did-finish-load')){
            if(-not $main.Contains($item)){throw "Missing important multiaccount feature: $item"}
          }
          $tabs=Get-Content 'release-build/v6.9/user-tabs.js' -Raw
          foreach($item in @('window.DIC','storeGet("app.token")','storeGet("app.userInfo")',
            'nameFromHeader','-webkit-app-region:no-drag!important',
            'pointer-events:none!important','min-height:38px','loginPageVisible')){
            if(-not $tabs.Contains($item)){throw "Missing verified tab fix: $item"}
          }
          if($main.Contains('fs.copyFileSync(') -or $main.Contains('session.token')){
            throw 'Forbidden cross-account secrets transfer'
          }
          Write-Host 'TAB_FULL_HITBOX_AND_NAME_LOOKUP_STATIC_CHECK=PASS'
          Write-Host 'RUNNING_ACCOUNT_REFOCUS_PATH_STATIC_CHECK=PASS'

      - name: Patch v6.8 with verified fast account and tab updates
        shell: pwsh
        run: |
          $source=Join-Path $env:RUNNER_TEMP 'DyclokPRO_6.8_win_x64.exe'
          $dest=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-9-prepackaged'
          & python tools/release-v6-9-user-tabs.py --installer $source --destination $dest --old-prelude 'release-build/v6.7/main-account-prelude.js' --prelude 'release-build/v6.9/main-account-prelude.js' --tabs 'release-build/v6.9/user-tabs.js'
          if($LASTEXITCODE -ne 0){throw 'BLOCKED: v6.8 original verification or ASAR patch failed'}
          foreach($p in @('DICloak.exe','DyclokPRO.ico','Dyclokpro_Perfiles_Locales.exe',
            'Chromium/Application/ginsbrowser.exe','Chromium/Application/142.0.7444.273/chrome.dll',
            'resources/app.asar','resources/app.asar.unpacked/dist/dyclokpro-users-v66.js',
            'resources/app.asar.unpacked/dist/dyclokpro-archive.js')){
            if(-not(Test-Path (Join-Path $dest $p) -PathType Leaf)){
              throw "Mandatory application component missing: $p"
            }
          }
          if(Test-Path (Join-Path $dest 'SourceData')){throw 'Private profiles included'}
          if(Test-Path (Join-Path $dest 'Chromium/User Data')){throw 'Private Chromium user data included'}
          Copy-Item -LiteralPath (Join-Path $dest 'DyclokPRO.ico') -Destination 'release-build/v6.9/DyclokPRO.ico' -Force
          $config=Get-Content 'release-build/v6.9/electron-builder.json' -Raw | ConvertFrom-Json
          if($config.nsis.installerIcon -ne 'DyclokPRO.ico' -or $config.nsis.uninstallerIcon -ne 'DyclokPRO.ico'){
            throw 'Installer branding unexpectedly regressed'
          }

      - name: Prepare Windows NSIS packager and native resource editor
        shell: pwsh
        working-directory: release-build/v6.9
        run: |
          & npm install --no-fund --no-audit --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'Cannot install Windows packaging dependencies'}
          $source=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-9-prepackaged\DICloak.exe'
          $icon=(Resolve-Path -LiteralPath 'DyclokPRO.ico').Path
          & node patch-windows-exe.mjs $source $icon
          if($LASTEXITCODE -ne 0){throw 'Cannot stamp Windows v6.9 executable'}
          if((Get-Item $source).VersionInfo.ProductName -ne 'DyclokPRO'){
            throw 'Native Windows product branding invalid'
          }

      - name: Build real complete Windows x64 NSIS installer
        shell: pwsh
        working-directory: release-build/v6.9
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $app=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-9-prepackaged'
          & npx electron-builder --win nsis --x64 --prepackaged $app --publish never --config electron-builder.json
          if($LASTEXITCODE -ne 0){throw 'NSIS Windows packaging failed'}
          $out='out/DyclokPRO_6.9_win_x64.exe'
          if(-not(Test-Path $out -PathType Leaf)){throw 'Compiled installer missing'}
          if((Get-Item $out).Length -lt 180000000){throw 'EXE smaller than complete Chromium installer'}
          $hash=(Get-FileHash -Algorithm SHA256 $out).Hash.ToLowerInvariant()
          "$hash  DyclokPRO_6.9_win_x64.exe" | Set-Content 'out/SHA256SUMS_v6.9.txt' -Encoding ascii
          Write-Host "INSTALLER_SHA256=$hash"

      - name: Verify actual extracted PE icon from newly built Windows installer
        shell: pwsh
        run: |
          & python -m pip install --disable-pip-version-check 'pefile==2024.8.26' 'Pillow==11.3.0'
          if($LASTEXITCODE -ne 0){throw 'Cannot install Windows resource inspection tools'}
          $installer='release-build/v6.9/out/DyclokPRO_6.9_win_x64.exe'
          & python tools/verify-v6-8-windows-icon.py --installer $installer --icon release-build/v6.9/DyclokPRO.ico --label 'NSIS installer'
          if($LASTEXITCODE -ne 0){throw 'BLOCKED: installer still contains generic Windows icon'}
          $app=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-9-prepackaged\DICloak.exe'
          & python tools/verify-v6-8-windows-icon.py --installer $app --icon release-build/v6.9/DyclokPRO.ico --label 'Installed application'
          if($LASTEXITCODE -ne 0){throw 'BLOCKED: installed application icon differs from DyclokPRO artwork'}

      - name: Test Windows installation and two isolated account startup paths
        shell: pwsh
        run: |
          $exe=(Resolve-Path -LiteralPath 'release-build/v6.9/out/DyclokPRO_6.9_win_x64.exe').Path
          $install=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO'
          if(Test-Path -LiteralPath $install){throw 'Dirty Windows test runner'}
          $setup=Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          if($setup.ExitCode -ne 0){throw "Silent installer returned $($setup.ExitCode)"}
          $program=Join-Path $install 'DICloak.exe'
          if(-not(Test-Path -LiteralPath $program -PathType Leaf)){throw 'Wrong installation path'}
          if((Get-Item $program).VersionInfo.ProductName -ne 'DyclokPRO'){
            throw 'Legacy product name still in Windows PE metadata'
          }
          $id='0123456789abcdef0123456789abcdef'
          $legacyTest=Join-Path $env:TEMP 'dyclokpro-v69-check-legacy.json'
          $isolatedTest=Join-Path $env:TEMP "dyclokpro-v69-check-$id.json"
          foreach($f in @($legacyTest,$isolatedTest)){
            if(Test-Path $f){Remove-Item $f -Force}
          }
          $a=Start-Process -FilePath $program -ArgumentList '--dyclok-self-test' -Wait -PassThru
          if($a.ExitCode -ne 0){throw "Existing user startup smoke test failed: $($a.ExitCode)"}
          $b=Start-Process -FilePath $program -ArgumentList "--dyclok-account=$id --dyclok-self-test" -Wait -PassThru
          if($b.ExitCode -ne 0){throw "Isolated user startup smoke test failed: $($b.ExitCode)"}
          if(-not(Test-Path $legacyTest) -or -not(Test-Path $isolatedTest)){
            throw 'Account bootstrap did not execute its smoke tests'
          }
          $old=Get-Content $legacyTest -Raw | ConvertFrom-Json
          $new=Get-Content $isolatedTest -Raw | ConvertFrom-Json
          if($old.id -ne 'legacy' -or $new.id -ne $id){throw 'Unexpected active account identifiers'}
          if($old.userData -eq $new.userData){throw 'BLOCKED: both accounts share Electron userData'}
          $expected=Join-Path $env:LOCALAPPDATA "DyclokPRO\Cuentas\$id\Electron"
          if($new.userData -ine $expected){throw "Unexpected isolated userData path: $($new.userData)"}
          if($new.sessionData -eq $old.sessionData){throw 'BLOCKED: sessions are not isolated'}
          Write-Host "ACCOUNT_ISOLATION_WINDOWS_SMOKE_TEST=PASS"
          Write-Host "INSTALL_DIR=$install"
          Write-Host 'REMOTE_LOGIN_CONCURRENT_ACCEPTANCE=NOT_TESTED'

      - name: Verify separate user shows actual login screen with blank password
        shell: pwsh
        run: |
          $program=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO\DICloak.exe'
          $id='abcdefabcdefabcdefabcdefabcdef12'
          $nonce='1234567890abcdef1234567890abcdef'
          $marker=Join-Path $env:LOCALAPPDATA "DyclokPRO\Cuentas\launch-$nonce.json"
          $folder=Join-Path $env:LOCALAPPDATA "DyclokPRO\Cuentas\$id\Electron"
          if(Test-Path -LiteralPath $folder){throw 'New-account test requires clean storage'}
          if(Test-Path -LiteralPath $marker){Remove-Item -LiteralPath $marker -Force}
          $p=Start-Process -FilePath $program -ArgumentList @("--dyclok-account=$id","--dyclok-launch=$nonce","--dyclok-login-smoke") -PassThru
          $found=$false
          try{
            for($i=0;$i -lt 100;$i++){
              if(Test-Path -LiteralPath $marker){$found=$true;break}
              Start-Sleep -Milliseconds 600
              $p.Refresh()
              if($p.HasExited){throw "New account GUI exited early (code $($p.ExitCode))"}
            }
            if(-not $found){throw 'New account GUI failed to load'}
            $result=Get-Content -LiteralPath $marker -Raw | ConvertFrom-Json
            if($result.account -ne $id -or $result.pid -ne $p.Id){throw 'Wrong account/window responded'}
            if($result.error){throw "Login test: $($result.error)"}
            if($result.loginFormVisible -ne $true){throw "No provider login form was rendered: $($result.url)"}
            if($result.passwordBlank -ne $true){throw 'New account unexpectedly reuses another saved password'}
            Write-Host 'SECOND_ACCOUNT_LOGIN_FORM_VISIBLE=PASS'
            Write-Host 'SECOND_ACCOUNT_PASSWORD_EMPTY=PASS'
          }finally{
            $p.Refresh()
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }

      - name: Verify EXE checksum and publish new v6.9 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='release-build/v6.9/out/DyclokPRO_6.9_win_x64.exe'
          $sum='release-build/v6.9/out/SHA256SUMS_v6.9.txt'
          $sha=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if((Get-Content $sum -Raw).Trim() -ne "$sha  DyclokPRO_6.9_win_x64.exe"){
            throw 'Checksum does not match uploaded installer'
          }
          & 7z l $exe | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Compiled NSIS package integrity failed'}
          $notes=@'
          # DyclokPRO v6.9 - Cuentas rápidas y clic completo

          Instalador completo Windows x64. Conserva instalacion en:
          %LOCALAPPDATA%\Programs\DyclokPRO

          - Los nombres de cuenta se leen del almacenamiento real DIC y se actualizan tras autenticar.
          - La cuenta que ya existía sigue siendo Cuenta principal y conserva sus datos.
          - Botón + Usuario abre directamente otra ventana para ingresar credenciales, sin solicitar nombre primero.
          - Confirmación de apertura solo después de que una ventana real haya cargado, mostrando errores si fracasa.
          - Cada cuenta nueva tiene su propia carpeta userData/sessionData.
          - Cierre de sesión sustituye el antiguo nombre autenticado por una etiqueta neutral.
          - No se copian ni reutilizan contraseñas, cookies de sesión o tokens entre cuentas.
          - No se modifica la autenticación, el bloqueo ni los permisos del servidor original.
          - Se mantienen icono DyclokPRO, Chromium, gestor de perfiles locales y archivo de respuestas v6.4.
          - Las actualizaciones automáticas del programa continúan desactivadas.

          PRUEBAS AUTOMÁTICAS: JavaScript, ASAR SHA256, Windows PE icon, NSIS, instalación y arranque aislado de
          dos identificadores de cuenta Windows comprobados antes de publicar.

          AVISO: la mejora de enfoque inmediato entre cuentas necesita comprobación con dos ventanas reales abiertas y autenticadas en el equipo del usuario; las pruebas automatizadas no usan credenciales.\n\n          LIMITACIÓN: el proveedor original puede impedir la conexión simultánea de
          varias cuentas en un mismo equipo. Estas pruebas no incluyen inicio de
          sesión real con varios usuarios. Si el servidor rechaza una segunda sesión,
          la aplicación mantiene ese rechazo. Cada cuenta se muestra en su propia
          ventana, no dentro de un navegador compartido.
          '@
          & gh release create v6.9 $exe $sum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'DyclokPRO v6.9 - Icono correcto del instalador EXE' --notes $notes --latest
          if($LASTEXITCODE -ne 0){throw 'Could not publish v6.9 to GitHub'}
          Write-Host 'DYCLOKPRO_V6_6_RELEASE_PUBLISHED=true'

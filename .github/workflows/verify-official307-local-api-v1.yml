name: Verify official 3.0.7 Local API V1 compatibility (no login)
on:
  push:
    branches: [fix/official307-documented-v1-api]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-contract-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile launcher and Local API adapter
        shell: pwsh
        run: |
          dotnet publish release-build/v6.35/Launcher/DyclokPRO.csproj -c Release -r win-x64 --self-contained false -o API_TEST
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
      - name: Run provider contract tests without account or key
        shell: pwsh
        run: |
          & ./API_TEST/DyclokPRO.exe --dyclok-api-contract-test
          if ($LASTEXITCODE -ne 0) { throw "API contract test failed ($LASTEXITCODE)" }
      - name: Ensure documented V1 is primary and forbidden auth changes absent
        shell: pwsh
        run: |
          $src = Get-Content release-build/v6.35/Launcher/OfficialApiArchiveWindow.cs -Raw
          if (-not $src.Contains('/openapi/v1/env/list?page_no=')) { throw 'Missing documented V1 endpoint' }
          if (-not $src.Contains('IsAbsentEndpoint(ex)')) { throw 'Missing restricted V2 fallback' }
          if (-not $src.Contains('usingLocalV1')) { throw 'Missing V1 safety mode' }
          if ($src -match 'X-DC-M1|X-DC-M2|X-Version') { throw 'Provider signed headers must remain in official client' }
          Write-Host 'Read-only adapter contract checks passed'

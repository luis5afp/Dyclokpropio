name: DyclokPRO v6.30 - intact 3.0.7 engine with external Windows launcher
on:
  push:
    branches: ['experiment/v6.30-official307-external-launcher']
    paths:
      - '.github/workflows/publish-v6-30-external307.yml'
      - 'release-build/v6.30/**'
      - 'tools/release-v6-30-intact307.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dyclokpro-v630-external307
  cancel-in-progress: false
jobs:
  build-publish:
    if: github.repository == 'luis5afp/Dyclokpropio'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $list=@(& gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'Unable to list releases'}
          if(@($list | Where-Object {$_.tagName -eq 'v6.30'}).Count -gt 0){throw 'v6.30 already published'}
      - name: Verify source and build independent Windows manager
        shell: pwsh
        run: |
          & python -m py_compile tools/release-v6-30-intact307.py
          if($LASTEXITCODE -ne 0){throw 'Python source invalid'}
          & dotnet --info
          if($LASTEXITCODE -ne 0){throw 'Windows .NET SDK not available'}
          & dotnet publish release-build/v6.30/Launcher/DyclokPRO.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o "$env:RUNNER_TEMP\dyclokpro-launcher"
          if($LASTEXITCODE -ne 0){throw 'External launcher compile failed'}
          $launcher=Join-Path $env:RUNNER_TEMP 'dyclokpro-launcher\DyclokPRO.exe'
          if(-not(Test-Path $launcher -PathType Leaf)){throw 'External WinForms manager EXE missing'}
          Write-Host 'EXTERNAL_LAUNCHER_COMPILED=PASS'
      - name: Download and verify exact official DICloak 3.0.7
        shell: pwsh
        run: |
          $download=Join-Path $env:RUNNER_TEMP 'DICloak_3.0.7_win_x64.exe'
          Invoke-WebRequest -Uri 'https://cdn1.dicloak.net/app/release/prod/DICloak_3.0.7_win_x64.exe' -OutFile $download -TimeoutSec 900
          if(-not(Test-Path $download -PathType Leaf)){throw 'Official installer missing'}
          $sha=(Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '01b412f603b1aeb0a9f479476d4dca2f1fe653c7d35b344a6fb59b45d1cc93ae'){
            throw "BLOCKED: 3.0.7 official installer hash changed ($sha)"
          }
      - name: Restore original signed application without ANY ASAR modifications
        shell: pwsh
        run: |
          $download=Join-Path $env:RUNNER_TEMP 'DICloak_3.0.7_win_x64.exe'
          $target=Join-Path $env:RUNNER_TEMP 'dyclokpro-630-pack'
          & python tools/release-v6-30-intact307.py --installer $download --destination $target
          if($LASTEXITCODE -ne 0){throw 'Official 3.0.7 integrity guard failed'}
          $launcher=Join-Path $env:RUNNER_TEMP 'dyclokpro-launcher\DyclokPRO.exe'
          Copy-Item -LiteralPath $launcher -Destination (Join-Path $target 'DyclokPRO.exe') -Force
          Copy-Item -LiteralPath 'application.ico' -Destination (Join-Path $target 'DyclokPRO.ico') -Force
          Copy-Item -LiteralPath 'application.ico' -Destination 'release-build/v6.30/DyclokPRO.ico' -Force
          if(Test-Path "$target\SourceData"){throw 'Private account data bundled'}
          if(Test-Path "$target\Chromium\User Data"){throw 'Private Chromium profile data bundled'}
          $original=(Get-FileHash (Join-Path $target 'DICloak.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'original-dicloak307.sha') -Value $original
          $asar=(Get-FileHash (Join-Path $target 'resources\app.asar') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($asar -ne 'b8ca8e2f36753149b23a6d339042bcf91c650e242d84c0d3af98e8141c0d1dcf'){
            throw 'BLOCKED: ASAR differs from the official original'
          }
          Write-Host 'OFFICIAL_EXE_AND_ASAR_UNCHANGED=PASS'
      - name: Build NSIS installer WITHOUT editing official EXE or ASAR
        shell: pwsh
        working-directory: release-build/v6.30
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          & npm install --no-audit --no-fund --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'Packager dependency install failed'}
          $app=Join-Path $env:RUNNER_TEMP 'dyclokpro-630-pack'
          & npx electron-builder --win nsis --x64 --prepackaged $app --publish never --config electron-builder.json
          if($LASTEXITCODE -ne 0){throw 'NSIS packaging failed'}
          $exe='out/DyclokPRO_6.30_win_x64.exe'
          if(-not(Test-Path $exe -PathType Leaf)){throw 'Installer missing'}
          if((Get-Item $exe).Length -lt 140000000){throw 'Installer incomplete'}
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  DyclokPRO_6.30_win_x64.exe" | Set-Content -Path 'out/SHA256SUMS_v6.30.txt' -Encoding ascii
          Write-Host "DYCLOKPRO_INSTALLER_SHA256=$sha"
      - name: Verify Windows installation and unmodified engine integrity
        shell: pwsh
        run: |
          $installer=(Resolve-Path 'release-build/v6.30/out/DyclokPRO_6.30_win_x64.exe').Path
          $root=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO'
          if(Test-Path $root){throw 'Unexpected previous installation on runner'}
          $installed=Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if($installed.ExitCode -ne 0){throw "Installation failed: $($installed.ExitCode)"}
          $main=Join-Path $root 'DICloak.exe'
          $launcher=Join-Path $root 'DyclokPRO.exe'
          $asar=Join-Path $root 'resources\app.asar'
          foreach($p in @($main,$launcher,$asar)){
            if(-not(Test-Path $p -PathType Leaf)){throw "Missing installed file $p"}
          }
          $asarHash=(Get-FileHash $asar -Algorithm SHA256).Hash.ToLowerInvariant()
          if($asarHash -ne 'b8ca8e2f36753149b23a6d339042bcf91c650e242d84c0d3af98e8141c0d1dcf'){
            throw 'BLOCKED: NSIS altered original ASAR'
          }
          $baseline=(Get-Content (Join-Path $env:RUNNER_TEMP 'original-dicloak307.sha') -Raw).Trim()
          $installedHash=(Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant()
          if($baseline -ne $installedHash){throw 'BLOCKED: packaging modified official DICloak.exe PE'}
          $marker=Join-Path $env:TEMP 'dyclokpro-v630-selftest.json'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          $self=Start-Process -FilePath $launcher -ArgumentList '--dyclok-self-test' -Wait -PassThru
          if($self.ExitCode -ne 0 -or -not(Test-Path $marker)){throw 'Independent Windows launcher self-test failed'}
          $test=Get-Content $marker -Raw | ConvertFrom-Json
          if(-not $test.validOriginalEngine -or $test.version -ne '6.30.0'){throw 'Manager reported invalid official runtime'}
          Write-Host 'OFFICIAL_PE_AND_ASAR_BYTE_IDENTICAL=PASS'
          Write-Host 'EXTERNAL_LAUNCHER_SELF_TEST=PASS'
      - name: Verify original DICloak starts without ASAR integrity error
        shell: pwsh
        run: |
          $exe=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO\DICloak.exe'
          $err=Join-Path $env:RUNNER_TEMP 'genuine-307-stderr.txt'
          $out=Join-Path $env:RUNNER_TEMP 'genuine-307-stdout.txt'
          $p=Start-Process -FilePath $exe -PassThru -RedirectStandardError $err -RedirectStandardOutput $out
          Start-Sleep -Seconds 15
          $p.Refresh()
          $logs=if(Test-Path $err){Get-Content $err -Raw -ErrorAction SilentlyContinue}else{''}
          if($logs -match 'Integrity check failed for asar archive|FATAL:asar_util.cc'){
            throw 'BLOCKED: official runtime still reports ASAR integrity failure'
          }
          if($p.HasExited -and $p.ExitCode -ne 0){
            Write-Host "OFFICIAL_PROCESS_EXIT=$($p.ExitCode)"
            Write-Host (($logs -split [Environment]::NewLine | Select-Object -Last 15) -join [Environment]::NewLine)
            throw 'Original 3.0.7 runtime exited with error'
          }
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          Write-Host 'OFFICIAL_DICLOAK_307_STARTUP_NO_ASAR_FATAL=PASS'
          Write-Host 'REAL_USER_LOGIN_AND_PROFILE_LOADING=NOT_TESTED'
      - name: Publish v6.30 experimental release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='release-build/v6.30/out/DyclokPRO_6.30_win_x64.exe'
          $sum='release-build/v6.30/out/SHA256SUMS_v6.30.txt'
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if((Get-Content $sum -Raw).Trim() -ne "$sha  DyclokPRO_6.30_win_x64.exe"){throw 'Checksum mismatch'}
          $notes=@'
          # DyclokPRO v6.30 - motor oficial DICloak 3.0.7 INTACTO

          Solucion del error FATAL asar_util.cc: NO se modifica el app.asar
          firmado ni el ejecutable DICloak.exe original. Los SHA256 del motor
          verificados antes y despues de instalar Windows deben ser identicos.
          El acceso directo lanza DyclokPRO.exe, un nuevo GESTOR EXTERNO en
          Windows Forms que abre el motor oficial.

          Funciones: listar cuentas existentes en Cuentas, crear/renombrar
          cuentas, abrir ventanas del cliente, abrir carpetas de archivos
          automaticos antiguas y su ubicacion de datos. Los entornos aislados
          configuran APPDATA/LOCALAPPDATA por cuenta, bajo Engine307, sin
          borrar datos existentes.

          LIMITACIONES IMPORTANTES: nueva version experimental.
          No incluye pestañas de usuarios dentro de UNA misma ventana.
          Las respuestas JSON nuevas NO se capturan automaticamente desde el
          cliente oficial firmado: el gestor solo permite abrir los archivos
          almacenados anteriormente. Es necesaria una API autorizada para
          futuros respaldos.
          El aislamiento real de sesiones del proveedor y la carga de perfiles
          autenticados no se validan en CI y requieren prueba en PC del usuario.
          No se desactiva la autenticacion ni la comprobacion de version.

          Hacer copia de %LOCALAPPDATA%\DyclokPRO\Cuentas y conservar v6.27
          antes de instalar. Abrir con el acceso directo DyclokPRO, no con
          DICloak.exe directamente. Si el motor oficial pide login, es normal
          en una cuenta nueva. No compartir archivos sensibles almacenados.
          '@
          & gh release create v6.30 $exe $sum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'DyclokPRO v6.30 - motor 3.0.7 intacto (experimental)' --notes $notes --prerelease
          if($LASTEXITCODE -ne 0){throw 'Could not publish experimental EXE'}
          Write-Host 'DYCLOKPRO_V630_PUBLISHED=PASS'

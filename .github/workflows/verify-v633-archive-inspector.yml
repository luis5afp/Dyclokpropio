name: DyclokPRO v6.33 - verify external archive inspector
on:
  push:
    branches:
      - 'feature/v6.33-parity-audit-and-local-inspector'
    paths:
      - '.github/workflows/verify-v633-archive-inspector.yml'
      - 'release-build/v6.33/Launcher/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Audit inspector for prohibited network or secret operations
        shell: pwsh
        run: |
          $src = Get-Content -LiteralPath 'release-build/v6.33/Launcher/ArchiveAuditWindow.cs' -Raw
          $main = Get-Content -LiteralPath 'release-build/v6.33/Launcher/Program.cs' -Raw
          if($src -match 'HttpClient|CookieContainer|safeStorage|X-Version|X-DC-M1|X-DC-M2'){
            throw 'Archive inspector must not access HTTP or signed headers'
          }
          if($src -notmatch 'ReparsePoint' -or $src -notmatch 'ArchivoOriginal'){
            throw 'Missing protection against links or missing local archive path'
          }
          if($main -notmatch 'new ArchiveAuditWindow'){
            throw 'Missing archive UI integration'
          }
          Write-Host 'ARCHIVE_DIAGNOSTIC_LOCAL_ONLY=PASS'
      - name: Compile external WinForms launcher without modifying signed provider runtime
        shell: pwsh
        run: |
          & dotnet publish 'release-build/v6.33/Launcher/DyclokPRO.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o "$env:RUNNER_TEMP\dyclokpro-v633-compile"
          if($LASTEXITCODE -ne 0){throw 'v6.33 compile failed'}
          if(-not(Test-Path "$env:RUNNER_TEMP\dyclokpro-v633-compile\DyclokPRO.exe")){
            throw 'Missing compiled external launcher'
          }
          Write-Host 'V633_LOCAL_ARCHIVE_VIEWER_WINDOWS_COMPILE=PASS'

name: Verify Installer Baseline

on:
  pull_request:
    paths:
      - 'dist/**'
      - 'dist-electron/**'
      - 'plugins/**'
      - 'vendor/**'
      - 'resources/**'
      - 'package.json'
      - 'tools/verify-build-assets.js'
      - 'bundled-extensions/**'
      - 'src/main/bundled-extension-*.js'
      - 'tools/unpack-bundled-extension.js'
      - 'tools/verify-bundled-extension.js'
      - 'tools/verify-extension-download-retry.js'
      - 'tools/verify-bootstrap-diagnostics.js'
      - 'src/main/extension-download-diagnostics.js'
      - 'tools/repair-extension-cache.ps1'
      - 'electron-builder.yml'
      - 'tools/verify-safe-base.js'
      - 'tools/apply-legacy-expand-check.js'
      - '.github/workflows/verify-runtime-assets.yml'
      - '.github/workflows/release-safe-base.yml'
      - 'tools/verify-release-workflow.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies for extension extraction
        run: npm install --legacy-peer-deps
      - name: Extract original extension package
        run: node tools/unpack-bundled-extension.js
      - name: Verify required runtime files
        run: node tools/verify-build-assets.js
      - name: Verify bundled extension load-contract
        run: node tools/verify-bundled-extension.js
      - name: Verify bounded extension downloader retry
        run: node tools/verify-extension-download-retry.js
      - name: Verify Electron bootstrap actually enables diagnostics
        run: node tools/verify-bootstrap-diagnostics.js
      - name: Verify original baseline hashes
        run: node tools/verify-safe-base.js
      - name: Verify 2.8.17 compatibility transformation without changing baseline
        run: node tools/apply-legacy-expand-check.js
      - name: Verify public release publication contract
        run: node tools/verify-release-workflow.js

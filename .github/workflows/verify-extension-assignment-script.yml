name: Verify Cookies Pro Profile Installer Script

on:
  push:
    branches:
      - main
    paths:
      - 'tools/set-extension-group-for-profiles.ps1'
      - '.github/workflows/verify-extension-assignment-script.yml'
  pull_request:
    paths:
      - 'tools/set-extension-group-for-profiles.ps1'
      - '.github/workflows/verify-extension-assignment-script.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-parse:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify PowerShell syntax without connecting to the local API
        shell: pwsh
        run: |
          $path = (Resolve-Path 'tools/set-extension-group-for-profiles.ps1').Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Host
            throw 'PowerShell parser errors detected.'
          }
          Write-Host 'PowerShell syntax OK.'

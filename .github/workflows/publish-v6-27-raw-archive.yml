name: DyclokPRO v6.27 - original responses by profile and Windows installer
on:
  push:
    branches:
      - 'release/v6.27'
    paths:
      - '.github/workflows/publish-v6-27-raw-archive.yml'
      - 'release-build/v6.27/**'
      - 'tools/release-v6-27-plain-archive.py'
      - 'tools/test-v6-27-raw-archive.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dyclokpro-v626-legacy-restore
  cancel-in-progress: false

jobs:
  build-publish:
    if: github.repository == 'luis5afp/Dyclokpropio'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout release sources
        uses: actions/checkout@v4

      - name: Do not overwrite existing published v6.27
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versions=@(& gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'Cannot list existing releases'}
          if(@($versions | Where-Object {$_.tagName -eq 'v6.27'}).Count -gt 0){
            throw 'BLOCKED: published v6.27 already exists'
          }

      - name: Validate native runtime guard and original response test
        shell: pwsh
        run: |
          & python -m py_compile tools/release-v6-27-plain-archive.py
          if($LASTEXITCODE -ne 0){throw 'Python script syntax failed'}
          & node --check release-build/v6.27/patch-windows-exe.mjs
          if($LASTEXITCODE -ne 0){throw 'PE patch syntax failed'}
          & node --check release-build/v6.27/raw-archive-backend.js
          if($LASTEXITCODE -ne 0){throw 'Archive backend syntax error'}
          & node --check release-build/v6.27/raw-archive-ui.js
          if($LASTEXITCODE -ne 0){throw 'Archive frontend syntax error'}
          & node tools/test-v6-27-raw-archive.cjs
          if($LASTEXITCODE -ne 0){throw 'Legacy auth preservation guard failed'}

      - name: Download and verify known-good v6.16 EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh release download v6.16 --repo $env:GITHUB_REPOSITORY --pattern 'DyclokPRO_6.16_win_x64.exe' --dir $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){throw 'Original v6.16 installer not found'}
          $file=Join-Path $env:RUNNER_TEMP 'DyclokPRO_6.16_win_x64.exe'
          $hash=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '03621252bb532766d984838213e25411b69220ff491ea86d0f81a928c104ff81'){
            throw 'BLOCKED: original v6.16 EXE differs'
          }

      - name: Restore original runtime and add isolated plaintext archive module
        shell: pwsh
        run: |
          $original=Join-Path $env:RUNNER_TEMP 'DyclokPRO_6.16_win_x64.exe'
          $dest=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-27-prepackaged'
          & python tools/release-v6-27-plain-archive.py --installer $original --destination $dest
          if($LASTEXITCODE -ne 0){throw 'Could not restore exact native v6.16 auth runtime'}
          Copy-Item -LiteralPath (Join-Path $dest 'DyclokPRO.ico') -Destination release-build/v6.27/DyclokPRO.ico -Force
          if(Test-Path (Join-Path $dest 'SourceData')){throw 'Private profile data bundled'}
          if(Test-Path (Join-Path $dest 'Chromium/User Data')){throw 'Private Chromium storage bundled'}

      - name: Build full Windows x64 NSIS installer
        shell: pwsh
        working-directory: release-build/v6.27
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          & npm install --no-audit --no-fund --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'Cannot install packager'}
          $app=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-27-prepackaged'
          $icon=(Resolve-Path -LiteralPath DyclokPRO.ico).Path
          & node patch-windows-exe.mjs (Join-Path $app 'DICloak.exe') $icon
          if($LASTEXITCODE -ne 0){throw 'PE branding failed'}
          & npx electron-builder --win nsis --x64 --prepackaged $app --publish never --config electron-builder.json
          if($LASTEXITCODE -ne 0){throw 'NSIS compile failed'}
          $exe='out/DyclokPRO_6.27_win_x64.exe'
          if(-not(Test-Path $exe -PathType Leaf)){throw 'EXE missing'}
          if((Get-Item $exe).Length -lt 180000000){throw 'Incomplete Chromium installer'}
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DyclokPRO_6.27_win_x64.exe" | Set-Content out/SHA256SUMS_v6.27.txt -Encoding ascii
          Write-Host "INSTALLER_SHA256=$hash"

      - name: Validate Windows installation and isolated local sessions
        shell: pwsh
        run: |
          $installer=(Resolve-Path 'release-build/v6.27/out/DyclokPRO_6.27_win_x64.exe').Path
          $install=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO'
          if(Test-Path -LiteralPath $install){throw 'Dirty Windows testing machine'}
          $setup=Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if($setup.ExitCode -ne 0){throw "Installer failed: $($setup.ExitCode)"}
          $app=Join-Path $install 'DICloak.exe'
          if(-not(Test-Path -LiteralPath $app -PathType Leaf)){throw 'Application missing after install'}
          if((Get-Item $app).VersionInfo.ProductName -ne 'DyclokPRO'){throw 'Windows product name incorrect'}
          $id='0123456789abcdef0123456789abcdef'
          $legacy=Join-Path $env:TEMP 'dyclokpro-v610-check-legacy.json'
          $isolated=Join-Path $env:TEMP "dyclokpro-v610-check-$id.json"
          foreach($f in @($legacy,$isolated)){if(Test-Path $f){Remove-Item $f -Force}}
          $one=Start-Process -FilePath $app -ArgumentList '--dyclok-self-test' -Wait -PassThru
          if($one.ExitCode -ne 0){throw 'Legacy account startup failed'}
          $two=Start-Process -FilePath $app -ArgumentList "--dyclok-account=$id --dyclok-self-test" -Wait -PassThru
          if($two.ExitCode -ne 0){throw 'Isolated account startup failed'}
          if(-not(Test-Path $legacy) -or -not(Test-Path $isolated)){throw 'Account test markers missing'}
          $a=Get-Content $legacy -Raw | ConvertFrom-Json
          $b=Get-Content $isolated -Raw | ConvertFrom-Json
          if($a.id -ne 'legacy' -or $b.id -ne $id -or $a.userData -eq $b.userData -or $a.sessionData -eq $b.sessionData){
            throw 'Electron accounts are not isolated'
          }
          Write-Host 'NATIVE_V616_ENGINE_RESTORED=PASS'
          Write-Host 'SECOND_ACCOUNT_ISOLATION=PASS'
          Write-Host 'REAL_SERVER_PROFILE_LOADING=NOT_TESTED'

      - name: Publish v6.27 candidate only after passing Windows checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='release-build/v6.27/out/DyclokPRO_6.27_win_x64.exe'
          $sum='release-build/v6.27/out/SHA256SUMS_v6.27.txt'
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if((Get-Content $sum -Raw).Trim() -ne "$hash  DyclokPRO_6.27_win_x64.exe"){throw 'Invalid installer checksum'}
          $notes=@'
          # DyclokPRO v6.27 — Archivos automáticos sin cifrar (candidato)

          Base original v6.16 verificada mediante SHA256; version interna 2.8.17.
          Se conserva el codigo original de autenticacion, la API y Chromium.
          Solo se reemplaza el archivador de respuestas HTTP. Las respuestas de
          texto JSON recibidas se guardan sin cifrado en archivos independientes,
          en carpetas con nombre real e identificador del perfil. No se crean
          manifiestos o referencias nuevas. Los archivos antiguos se conservan.

          Aviso: las respuestas sin cifrar pueden contener informacion privada;
          no comparta esa carpeta. No se garantiza que la API entregue todos los
          archivos del perfil ni se capturan ficheros binarios de Chromium.

          CI prueba instalacion Windows y dos cuentas aisladas, pero NO prueba
          la carga autenticada de perfiles con el servidor. Es una candidata.
          Haga respaldo de la carpeta Cuentas antes de instalar.
          '@
          & gh release create v6.27 $exe $sum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'DyclokPRO v6.27 - archivos originales por perfil (candidato)' --notes $notes --prerelease
          if($LASTEXITCODE -ne 0){throw 'Cannot publish v6.27'}
          Write-Host 'DYCLOKPRO_V627_PUBLICATION=PASS'

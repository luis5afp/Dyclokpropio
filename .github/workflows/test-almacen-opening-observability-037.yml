name: Validate per-profile opening and authorized reception diagnostics
on:
  push:
    branches: [feature/almacen-opening-observability-037]
    paths:
      - "tools/dicloak-profile-lifecycle-trace.cjs"
      - "tools/run-dicloak-openapi-test-receiver.cjs"
      - "tools/almacen-allowed-cdp.cjs"
      - "tools/test-dicloak-profile-lifecycle-trace.cjs"
      - "tools/test-dicloak-existing-profile-cdp-037.cjs"
      - "tools/verify-almacen-test-manifest.cjs"
      - "tools/test-verify-almacen-test-manifest.cjs"
      - ".github/workflows/test-almacen-opening-observability-037.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle-and-cdp:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check tools/dicloak-profile-lifecycle-trace.cjs
          node --check tools/almacen-allowed-cdp.cjs
          node --check tools/run-dicloak-openapi-test-receiver.cjs
      - name: Inspect synthetic profile opening, preexisting pages, permitted files and privacy boundaries
        run: node --test tools/test-dicloak-profile-lifecycle-trace.cjs tools/test-dicloak-existing-profile-cdp-037.cjs tools/test-verify-almacen-test-manifest.cjs tools/test-dicloak-openapi-cdp-036.cjs tools/test-almacen-profile-test-receiver.cjs

name: DyclokPRO v6.25 - restore v6.16 network and update IPC

on:
  push:
    branches:
      - 'fix/v6.25-v616-auth-compat'
    paths:
      - '.github/workflows/publish-v6-25-v616-auth-compat.yml'
      - 'release-build/v6.25/**'
      - 'tools/release-v6-25-auth-compat.py'
      - 'tools/test-v6-25-auth-compat.cjs'
      - 'release-build/v6.25/live-diagnostics.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dyclokpro-v6-25-version-policy
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.repository == 'luis5afp/Dyclokpropio'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout verified user-tabs source
        uses: actions/checkout@v4

      - name: Refuse overwriting published v6.25
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versions=@(& gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'Cannot enumerate existing releases'}
          if(@($versions | Where-Object {$_.tagName -eq 'v6.25'}).Count -gt 0){
            throw 'BLOCKED: immutable v6.25 release already exists'
          }

      - name: Download full v6.16 Windows EXE and verify SHA256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh release download v6.16 --repo $env:GITHUB_REPOSITORY --pattern 'DyclokPRO_6.16_win_x64.exe' --dir $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){throw 'Missing original v6.16 published installer'}
          $file=Join-Path $env:RUNNER_TEMP 'DyclokPRO_6.16_win_x64.exe'
          $hash=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '03621252bb532766d984838213e25411b69220ff491ea86d0f81a928c104ff81'){
            throw 'BLOCKED: base installer integrity differs'
          }

      - name: Verify v6.16 native IPC, network and diagnostic syntax
        shell: pwsh
        run: |
          & node --check 'release-build/v6.25/compat-prelude.js'
          if($LASTEXITCODE -ne 0){throw 'Version prelude invalid'}
          & node --check 'release-build/v6.25/live-diagnostics.js'
          if($LASTEXITCODE -ne 0){throw 'Diagnostic panel JS syntax invalid'}
          if($LASTEXITCODE -ne 0){throw 'Installed version prelude invalid'}
          & node tools/test-v6-25-auth-compat.cjs
          if($LASTEXITCODE -ne 0){throw 'V6.16 native request and IPC compatibility tests failed'}
          $manifest=Get-Content 'release-build/v6.25/package.json' -Raw | ConvertFrom-Json
          if($manifest.version -ne '6.25.0'){throw 'DyclokPRO 6.25.0 Windows packager manifest is wrong'}
          if($manifest.devDependencies.'electron-builder' -ne '26.15.3'){throw 'Electron builder dependency modified unexpectedly'}
          $diag=Get-Content 'release-build/v6.25/live-diagnostics.js' -Raw
          if(-not $diag.Contains('creatingPanel') -or -not $diag.Contains('safeMainFrame') -or -not $diag.Contains('routeGroup')){throw 'Missing diagnostic isolation or safe error source tracing'}
          $ui=Get-Content 'release-build/v6.25/live-diagnostics.js' -Raw
          if($ui.Contains('setImmediate(createPanel)')){throw 'Diagnostic panel still auto-opens'}
          if($ui.Contains('XMLHttpRequest.prototype') -or $ui.Contains('window.fetch=')){throw 'Network interception not permitted'}
          if(-not $ui.Contains('dyclokpro-side-diagnostics-toggle') -or -not $ui.Contains('togglePanel()')){
            throw 'Missing right side diagnostic tab or toggle handler'
          }
          Write-Host 'TECHNICAL_CLIENT_VERSION_3_0_6_VERSION_IPC_DELEGATED=PASS'

      - name: Repackage v6.16 with original native networking and updater behavior
        shell: pwsh
        run: |
          $source=Join-Path $env:RUNNER_TEMP 'DyclokPRO_6.16_win_x64.exe'
          $dest=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-25-prepackaged'
          & python tools/release-v6-25-auth-compat.py --installer $source --destination $dest --backend 'release-build/v6.25/compat-prelude.js'
          if($LASTEXITCODE -ne 0){throw 'Version 3.0.6 compatibility package failed'}
          if((Get-Content 'release-build/v6.25/package.json' -Raw | ConvertFrom-Json).version -ne '6.25.0'){throw 'Incorrect installer marketing version'}
          if(-not $((Get-Content 'release-build/v6.25/live-diagnostics.js' -Raw).Contains('safeMainFrame'))){throw 'Missing safe error tracer'}
          # The build script verifies the packed app.asar package.json equals 3.0.6.
          # The release/installer package.json must separately remain v6.25.0.
          foreach($p in @('DICloak.exe','DyclokPRO.ico','Dyclokpro_Perfiles_Locales.exe',
            'Chromium/Application/ginsbrowser.exe','Chromium/Application/142.0.7444.273/chrome.dll',
            'resources/app.asar','resources/app.asar.unpacked/dist/dyclokpro-users-v66.js',
            'resources/app.asar.unpacked/dist/dyclokpro-archive.js',
            'resources/app.asar.unpacked/dist/dyclokpro-local-access.js')){
            if(-not(Test-Path (Join-Path $dest $p) -PathType Leaf)){throw "Missing mandatory file: $p"}
          }
          if(Test-Path (Join-Path $dest 'SourceData')){throw 'Private Chromium profiles bundled'}
          if(Test-Path (Join-Path $dest 'Chromium/User Data')){throw 'Private Chromium user data bundled'}
          Copy-Item -LiteralPath (Join-Path $dest 'DyclokPRO.ico') -Destination 'release-build/v6.25/DyclokPRO.ico' -Force

      - name: Prepare Windows NSIS packager and native resource editor
        shell: pwsh
        working-directory: release-build/v6.25
        run: |
          & npm install --no-fund --no-audit --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'Cannot install Windows packaging dependencies'}
          $source=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-25-prepackaged\DICloak.exe'
          $icon=(Resolve-Path -LiteralPath 'DyclokPRO.ico').Path
          & node patch-windows-exe.mjs $source $icon
          if($LASTEXITCODE -ne 0){throw 'Cannot stamp Windows v6.25 executable'}
          if((Get-Item $source).VersionInfo.ProductName -ne 'DyclokPRO'){
            throw 'Native Windows product branding invalid'
          }

      - name: Build real complete Windows x64 NSIS installer
        shell: pwsh
        working-directory: release-build/v6.25
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $app=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-25-prepackaged'
          & npx electron-builder --win nsis --x64 --prepackaged $app --publish never --config electron-builder.json
          if($LASTEXITCODE -ne 0){throw 'NSIS Windows packaging failed'}
          $out='out/DyclokPRO_6.25_win_x64.exe'
          if(-not(Test-Path $out -PathType Leaf)){throw 'Compiled installer missing'}
          if((Get-Item $out).Length -lt 180000000){throw 'EXE smaller than complete Chromium installer'}
          $hash=(Get-FileHash -Algorithm SHA256 $out).Hash.ToLowerInvariant()
          "$hash  DyclokPRO_6.25_win_x64.exe" | Set-Content 'out/SHA256SUMS_v6.25.txt' -Encoding ascii
          Write-Host "INSTALLER_SHA256=$hash"

      - name: Verify actual extracted PE icon from newly built Windows installer
        shell: pwsh
        run: |
          & python -m pip install --disable-pip-version-check 'pefile==2024.8.26' 'Pillow==11.3.0'
          if($LASTEXITCODE -ne 0){throw 'Cannot install Windows resource inspection tools'}
          $installer='release-build/v6.25/out/DyclokPRO_6.25_win_x64.exe'
          & python tools/verify-v6-8-windows-icon.py --installer $installer --icon release-build/v6.25/DyclokPRO.ico --label 'NSIS installer'
          if($LASTEXITCODE -ne 0){throw 'BLOCKED: installer still contains generic Windows icon'}
          $app=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-25-prepackaged\DICloak.exe'
          & python tools/verify-v6-8-windows-icon.py --installer $app --icon release-build/v6.25/DyclokPRO.ico --label 'Installed application'
          if($LASTEXITCODE -ne 0){throw 'BLOCKED: installed application icon differs from DyclokPRO artwork'}

      - name: Test Windows installation and two isolated account startup paths
        shell: pwsh
        run: |
          $exe=(Resolve-Path -LiteralPath 'release-build/v6.25/out/DyclokPRO_6.25_win_x64.exe').Path
          $install=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO'
          if(Test-Path -LiteralPath $install){throw 'Dirty Windows test runner'}
          $setup=Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          if($setup.ExitCode -ne 0){throw "Silent installer returned $($setup.ExitCode)"}
          $program=Join-Path $install 'DICloak.exe'
          if(-not(Test-Path -LiteralPath $program -PathType Leaf)){throw 'Wrong installation path'}
          if((Get-Item $program).VersionInfo.ProductName -ne 'DyclokPRO'){
            throw 'Legacy product name still in Windows PE metadata'
          }
          $id='0123456789abcdef0123456789abcdef'
          $legacyTest=Join-Path $env:TEMP 'dyclokpro-v610-check-legacy.json'
          $isolatedTest=Join-Path $env:TEMP "dyclokpro-v610-check-$id.json"
          foreach($f in @($legacyTest,$isolatedTest)){
            if(Test-Path $f){Remove-Item $f -Force}
          }
          $a=Start-Process -FilePath $program -ArgumentList '--dyclok-self-test' -Wait -PassThru
          if($a.ExitCode -ne 0){throw "Existing user startup smoke test failed: $($a.ExitCode)"}
          $b=Start-Process -FilePath $program -ArgumentList "--dyclok-account=$id --dyclok-self-test" -Wait -PassThru
          if($b.ExitCode -ne 0){throw "Isolated user startup smoke test failed: $($b.ExitCode)"}
          if(-not(Test-Path $legacyTest) -or -not(Test-Path $isolatedTest)){
            throw 'Account bootstrap did not execute its smoke tests'
          }
          $old=Get-Content $legacyTest -Raw | ConvertFrom-Json
          $new=Get-Content $isolatedTest -Raw | ConvertFrom-Json
          if($old.id -ne 'legacy' -or $new.id -ne $id){throw 'Unexpected active account identifiers'}
          if($old.userData -eq $new.userData){throw 'BLOCKED: both accounts share Electron userData'}
          $expected=Join-Path $env:LOCALAPPDATA "DyclokPRO\Cuentas\$id\Electron"
          if($new.userData -ine $expected){throw "Unexpected isolated userData path: $($new.userData)"}
          if($new.sessionData -eq $old.sessionData){throw 'BLOCKED: sessions are not isolated'}
          $link=Join-Path $install 'Cuentas'
          $target=Join-Path $env:LOCALAPPDATA 'DyclokPRO\Cuentas'
          if(-not(Test-Path -LiteralPath $link -PathType Container)){throw 'Cuentas folder missing inside installation'}
          $junction=Get-Item -LiteralPath $link -Force
          if(-not($junction.Attributes -band [System.IO.FileAttributes]::ReparsePoint)){
            throw 'Cuentas must be an NTFS junction preserving original storage'
          }
          if(-not(Test-Path -LiteralPath (Join-Path $link 'legacy\ArchivoOriginal\Perfiles'))){
            throw 'Original legacy account not visible from installation'
          }
          if(-not(Test-Path -LiteralPath (Join-Path $link "$id\ArchivoOriginal\Perfiles"))){
            throw 'Second account not visible from installation'
          }
          if(-not(Test-Path -LiteralPath (Join-Path $target 'legacy\ArchivoOriginal\Perfiles'))){
            throw 'Original physical account archive missing'
          }
          Write-Host 'CUENTAS_INSTALL_JUNCTION_VISIBLE=PASS'
          Write-Host 'ORIGINAL_ARCHIVE_STORAGE_PRESERVED=PASS'
          Write-Host "ACCOUNT_ISOLATION_WINDOWS_SMOKE_TEST=PASS"
          Write-Host "INSTALL_DIR=$install"
          Write-Host 'REMOTE_LOGIN_CONCURRENT_ACCEPTANCE=NOT_TESTED'

      - name: Verify installed offline Chromium profile manager
        shell: pwsh
        run: |
          $manager=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO\Dyclokpro_Perfiles_Locales.exe'
          if(-not(Test-Path -LiteralPath $manager -PathType Leaf)){
            throw 'Offline local profile manager is missing'
          }
          $output=(& $manager --self-test 2>&1 | Out-String)
          if($LASTEXITCODE -ne $null -and $LASTEXITCODE -ne 0){
            throw "Chromium local manager exit failure: $LASTEXITCODE"
          }
          if(-not $output.Contains('LOCAL_PROFILE_TEST=PASS')){
            throw "Chromium local manager did not confirm self-test: $output"
          }
          Write-Host 'OFFLINE_CHROMIUM_LOCAL_MANAGER_PRESENT=PASS'

      - name: Verify separate user shows actual login screen with blank password
        shell: pwsh
        run: |
          $program=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO\DICloak.exe'
          $id='abcdefabcdefabcdefabcdefabcdef12'
          $nonce='1234567890abcdef1234567890abcdef'
          $marker=Join-Path $env:LOCALAPPDATA "DyclokPRO\Cuentas\launch-$nonce.json"
          $folder=Join-Path $env:LOCALAPPDATA "DyclokPRO\Cuentas\$id\Electron"
          if(Test-Path -LiteralPath $folder){throw 'New-account test requires clean storage'}
          if(Test-Path -LiteralPath $marker){Remove-Item -LiteralPath $marker -Force}
          $p=Start-Process -FilePath $program -ArgumentList @("--dyclok-account=$id","--dyclok-launch=$nonce","--dyclok-login-smoke") -PassThru
          $found=$false
          try{
            for($i=0;$i -lt 100;$i++){
              if(Test-Path -LiteralPath $marker){$found=$true;break}
              Start-Sleep -Milliseconds 600
              $p.Refresh()
              if($p.HasExited){throw "New account GUI exited early (code $($p.ExitCode))"}
            }
            if(-not $found){throw 'New account GUI failed to load'}
            $result=Get-Content -LiteralPath $marker -Raw | ConvertFrom-Json
            if($result.account -ne $id -or $result.pid -ne $p.Id){throw 'Wrong account/window responded'}
            if($result.error){throw "Login test: $($result.error)"}
            if($result.loginFormVisible -ne $true){throw "No provider login form was rendered: $($result.url)"}
            if($result.passwordBlank -ne $true){throw 'New account unexpectedly reuses another saved password'}
            Write-Host 'SECOND_ACCOUNT_LOGIN_FORM_VISIBLE=PASS'
            Write-Host 'SECOND_ACCOUNT_PASSWORD_EMPTY=PASS'
          }finally{
            $p.Refresh()
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }

      - name: Verify right-side diagnostic tab toggles panel twice while automatic TXT stays enabled
        shell: pwsh
        run: |
          $program=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO\DICloak.exe'
          $id='fedcba9876543210fedcba9876543210'
          $marker=Join-Path $env:TEMP 'dyclokpro-v625-diag-smoke.json'
          if(Test-Path $marker){Remove-Item $marker -Force}
          $p=Start-Process -FilePath $program -ArgumentList @("--dyclok-account=$id","--dyclok-diagnostics-smoke") -PassThru
          try{
            $found=$false
            for($i=0;$i -lt 100;$i++){
              if(Test-Path $marker){$found=$true;break}
              Start-Sleep -Milliseconds 600
              $p.Refresh()
              if($p.HasExited){throw "Diagnostic-enabled process exited before panel loaded: $($p.ExitCode)"}
            }
            if(-not $found){throw 'Diagnostic panel did not initialize'}
            $result=Get-Content $marker -Raw | ConvertFrom-Json
            if($result.ready -ne $true -or $result.account -ne $id){throw 'Invalid diagnostic panel marker'}
            if($result.defaultClosed -ne $true -or $result.openedBySideButton -ne $true -or $result.closedBySideButton -ne $true){
              throw 'Side tab did not start closed and toggle open-closed from the same button'
            }
            if(-not(Test-Path $result.txt -PathType Leaf)){throw 'Automatic Notepad text report not created'}
            $log=Get-Content $result.txt -Raw
            if(-not $log.Contains('STARTUP') -or -not $log.Contains('PANEL_READY')){
              throw 'Diagnostic TXT is missing startup or panel-ready events'
            }
            $expected=Join-Path $env:LOCALAPPDATA "DyclokPRO\Cuentas\$id\Diagnosticos"
            if(-not $result.txt.StartsWith($expected,[System.StringComparison]::OrdinalIgnoreCase)){
              throw 'Diagnostic TXT stored outside the active account'
            }
            Write-Host 'SIDE_DIAGNOSTICS_TAB_OPENS_AND_CLOSES=PASS'
            Write-Host 'AUTO_NOTEPAD_TXT_PER_ACCOUNT=PASS'
          }finally{
            $p.Refresh()
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }

      - name: Verify EXE checksum and publish v6.25 compatibility diagnostic prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='release-build/v6.25/out/DyclokPRO_6.25_win_x64.exe'
          $sum='release-build/v6.25/out/SHA256SUMS_v6.25.txt'
          $sha=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if((Get-Content $sum -Raw).Trim() -ne "$sha  DyclokPRO_6.25_win_x64.exe"){
            throw 'Checksum does not match uploaded installer'
          }
          & 7z l $exe | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Compiled NSIS package integrity failed'}
          $notes=@'
          # DyclokPRO v6.25 — prueba de compatibilidad de autenticación con v6.16

          Se restaura el comportamiento de los controladores IPC nativos de
          actualización de v6.16: se elimina el interceptor posterior que
          sustituyó las respuestas originales de Electron.

          Se elimina la instrumentación que reemplazaba XMLHttpRequest y
          window.fetch al cargar la interfaz: ahora el diagnóstico registra
          únicamente eventos de ventana, excepciones seguras y cambios de
          pantalla, sin alterar solicitudes HTTP.

          Se conserva la versión técnica 3.0.6 solicitada, el botón lateral
          para abrir/cerrar el diagnóstico, y su archivo TXT automático.
          Chromium, cuentas, cookies y sesiones permanecen sin modificar.
          La identificación técnica difiere de v6.16, que informaba 2.8.17.

          **Aviso:** no se ha comprobado con una sesión autenticada si se
          soluciona el error de API 300003 / GHOST_USER. Si persiste,
          el siguiente aislamiento debe probar la versión original del paquete
          sin alterar ninguna regla del proveedor ni suprimir el cierre.

          Los mecanismos nativos de actualización de v6.16 vuelven a operar
          según la configuración original; si presentan avisos de actualización,
          no instales automáticamente una versión de un tercero.

          Antes de instalar, haz una copia de seguridad de Cuentas.
          '@
          & gh release create v6.25 $exe $sum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'DyclokPRO v6.25 - Compatibilidad de versión original (prueba)' --notes $notes --prerelease
          if($LASTEXITCODE -ne 0){throw 'Could not publish v6.25 to GitHub'}
          Write-Host 'DYCLOKPRO_V6_20_RELEASE_PUBLISHED=true'

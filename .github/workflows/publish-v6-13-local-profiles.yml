name: DyclokPRO v6.13 - Acceso directo a perfiles locales

on:
  push:
    branches:
      - 'release/v6.13-direct-local-profiles'
    paths:
      - '.github/workflows/publish-v6-13-local-profiles.yml'
      - 'release-build/v6.13/**'
      - 'tools/release-v6-13-direct-local.py'
      - 'tools/test-v6-13-local-profiles.cjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dyclokpro-v6-13-local-profiles
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.repository == 'luis5afp/Dyclokpropio'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout verified user-tabs source
        uses: actions/checkout@v4

      - name: Refuse overwriting published v6.13
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versions=@(& gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'Cannot enumerate existing releases'}
          if(@($versions | Where-Object {$_.tagName -eq 'v6.13'}).Count -gt 0){
            throw 'BLOCKED: immutable v6.13 release already exists'
          }

      - name: Download full v6.12 Windows EXE and verify SHA256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh release download v6.12 --repo $env:GITHUB_REPOSITORY --pattern 'DyclokPRO_6.12_win_x64.exe' --dir $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){throw 'Missing original v6.12 published installer'}
          $file=Join-Path $env:RUNNER_TEMP 'DyclokPRO_6.12_win_x64.exe'
          $hash=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne 'b503bc7077dd681723077828b2b4b7b526199375c91c203912c9a200d3502c71'){
            throw 'BLOCKED: base installer integrity differs'
          }

      - name: Test independent local profile launcher and remote authentication boundary
        shell: pwsh
        run: |
          & node --check 'release-build/v6.13/local-profiles-backend.js'
          if($LASTEXITCODE -ne 0){throw 'Local launcher JS invalid'}
          & node --check 'release-build/v6.13/local-profiles-ui.js'
          if($LASTEXITCODE -ne 0){throw 'Local launcher renderer invalid'}
          & node tools/test-v6-13-local-profiles.cjs
          if($LASTEXITCODE -ne 0){throw 'Local profiles access/security regression test failed'}
          Write-Host 'DIRECT_LOCAL_PROFILES_WITHOUT_REMOTE_LOGIN=PASS'

      - name: Repack full verified v6.12 with local profiles button
        shell: pwsh
        run: |
          $source=Join-Path $env:RUNNER_TEMP 'DyclokPRO_6.12_win_x64.exe'
          $dest=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-13-prepackaged'
          & python tools/release-v6-13-direct-local.py --installer $source --destination $dest --backend 'release-build/v6.13/local-profiles-backend.js' --local-ui 'release-build/v6.13/local-profiles-ui.js'
          if($LASTEXITCODE -ne 0){throw 'Verified v6.12 local manager repack failed'}
          foreach($p in @('DICloak.exe','DyclokPRO.ico','Dyclokpro_Perfiles_Locales.exe',
            'Chromium/Application/ginsbrowser.exe','Chromium/Application/142.0.7444.273/chrome.dll',
            'resources/app.asar','resources/app.asar.unpacked/dist/dyclokpro-users-v66.js',
            'resources/app.asar.unpacked/dist/dyclokpro-archive.js',
            'resources/app.asar.unpacked/dist/dyclokpro-local-access.js')){
            if(-not(Test-Path (Join-Path $dest $p) -PathType Leaf)){throw "Missing original/local component: $p"}
          }
          if(Test-Path (Join-Path $dest 'SourceData')){throw 'Private profiles included'}
          if(Test-Path (Join-Path $dest 'Chromium/User Data')){throw 'Private Chromium user data included'}
          Copy-Item -LiteralPath (Join-Path $dest 'DyclokPRO.ico') -Destination 'release-build/v6.13/DyclokPRO.ico' -Force
          Copy-Item -LiteralPath 'release-build/v6.10/installer.nsh' -Destination 'release-build/v6.13/installer.nsh' -Force

      - name: Prepare Windows NSIS packager and native resource editor
        shell: pwsh
        working-directory: release-build/v6.13
        run: |
          & npm install --no-fund --no-audit --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'Cannot install Windows packaging dependencies'}
          $source=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-13-prepackaged\DICloak.exe'
          $icon=(Resolve-Path -LiteralPath 'DyclokPRO.ico').Path
          & node patch-windows-exe.mjs $source $icon
          if($LASTEXITCODE -ne 0){throw 'Cannot stamp Windows v6.13 executable'}
          if((Get-Item $source).VersionInfo.ProductName -ne 'DyclokPRO'){
            throw 'Native Windows product branding invalid'
          }

      - name: Build real complete Windows x64 NSIS installer
        shell: pwsh
        working-directory: release-build/v6.13
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $app=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-13-prepackaged'
          & npx electron-builder --win nsis --x64 --prepackaged $app --publish never --config electron-builder.json
          if($LASTEXITCODE -ne 0){throw 'NSIS Windows packaging failed'}
          $out='out/DyclokPRO_6.13_win_x64.exe'
          if(-not(Test-Path $out -PathType Leaf)){throw 'Compiled installer missing'}
          if((Get-Item $out).Length -lt 180000000){throw 'EXE smaller than complete Chromium installer'}
          $hash=(Get-FileHash -Algorithm SHA256 $out).Hash.ToLowerInvariant()
          "$hash  DyclokPRO_6.13_win_x64.exe" | Set-Content 'out/SHA256SUMS_v6.13.txt' -Encoding ascii
          Write-Host "INSTALLER_SHA256=$hash"

      - name: Verify actual extracted PE icon from newly built Windows installer
        shell: pwsh
        run: |
          & python -m pip install --disable-pip-version-check 'pefile==2024.8.26' 'Pillow==11.3.0'
          if($LASTEXITCODE -ne 0){throw 'Cannot install Windows resource inspection tools'}
          $installer='release-build/v6.13/out/DyclokPRO_6.13_win_x64.exe'
          & python tools/verify-v6-8-windows-icon.py --installer $installer --icon release-build/v6.13/DyclokPRO.ico --label 'NSIS installer'
          if($LASTEXITCODE -ne 0){throw 'BLOCKED: installer still contains generic Windows icon'}
          $app=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-13-prepackaged\DICloak.exe'
          & python tools/verify-v6-8-windows-icon.py --installer $app --icon release-build/v6.13/DyclokPRO.ico --label 'Installed application'
          if($LASTEXITCODE -ne 0){throw 'BLOCKED: installed application icon differs from DyclokPRO artwork'}

      - name: Test Windows installation and two isolated account startup paths
        shell: pwsh
        run: |
          $exe=(Resolve-Path -LiteralPath 'release-build/v6.13/out/DyclokPRO_6.13_win_x64.exe').Path
          $install=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO'
          if(Test-Path -LiteralPath $install){throw 'Dirty Windows test runner'}
          $setup=Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          if($setup.ExitCode -ne 0){throw "Silent installer returned $($setup.ExitCode)"}
          $program=Join-Path $install 'DICloak.exe'
          if(-not(Test-Path -LiteralPath $program -PathType Leaf)){throw 'Wrong installation path'}
          if((Get-Item $program).VersionInfo.ProductName -ne 'DyclokPRO'){
            throw 'Legacy product name still in Windows PE metadata'
          }
          $id='0123456789abcdef0123456789abcdef'
          $legacyTest=Join-Path $env:TEMP 'dyclokpro-v610-check-legacy.json'
          $isolatedTest=Join-Path $env:TEMP "dyclokpro-v610-check-$id.json"
          foreach($f in @($legacyTest,$isolatedTest)){
            if(Test-Path $f){Remove-Item $f -Force}
          }
          $a=Start-Process -FilePath $program -ArgumentList '--dyclok-self-test' -Wait -PassThru
          if($a.ExitCode -ne 0){throw "Existing user startup smoke test failed: $($a.ExitCode)"}
          $b=Start-Process -FilePath $program -ArgumentList "--dyclok-account=$id --dyclok-self-test" -Wait -PassThru
          if($b.ExitCode -ne 0){throw "Isolated user startup smoke test failed: $($b.ExitCode)"}
          if(-not(Test-Path $legacyTest) -or -not(Test-Path $isolatedTest)){
            throw 'Account bootstrap did not execute its smoke tests'
          }
          $old=Get-Content $legacyTest -Raw | ConvertFrom-Json
          $new=Get-Content $isolatedTest -Raw | ConvertFrom-Json
          if($old.id -ne 'legacy' -or $new.id -ne $id){throw 'Unexpected active account identifiers'}
          if($old.userData -eq $new.userData){throw 'BLOCKED: both accounts share Electron userData'}
          $expected=Join-Path $env:LOCALAPPDATA "DyclokPRO\Cuentas\$id\Electron"
          if($new.userData -ine $expected){throw "Unexpected isolated userData path: $($new.userData)"}
          if($new.sessionData -eq $old.sessionData){throw 'BLOCKED: sessions are not isolated'}
          Write-Host "ACCOUNT_ISOLATION_WINDOWS_SMOKE_TEST=PASS"
          Write-Host "INSTALL_DIR=$install"
          Write-Host 'REMOTE_LOGIN_CONCURRENT_ACCEPTANCE=NOT_TESTED'

      - name: Verify installed offline Chromium profile manager
        shell: pwsh
        run: |
          $manager=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO\Dyclokpro_Perfiles_Locales.exe'
          if(-not(Test-Path -LiteralPath $manager -PathType Leaf)){
            throw 'Offline local profile manager is missing'
          }
          $output=(& $manager --self-test 2>&1 | Out-String)
          if($LASTEXITCODE -ne $null -and $LASTEXITCODE -ne 0){
            throw "Chromium local manager exit failure: $LASTEXITCODE"
          }
          if(-not $output.Contains('LOCAL_PROFILE_TEST=PASS')){
            throw "Chromium local manager did not confirm self-test: $output"
          }
          Write-Host 'OFFLINE_CHROMIUM_LOCAL_MANAGER_PRESENT=PASS'

      - name: Verify separate user shows actual login screen with blank password
        shell: pwsh
        run: |
          $program=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO\DICloak.exe'
          $id='abcdefabcdefabcdefabcdefabcdef12'
          $nonce='1234567890abcdef1234567890abcdef'
          $marker=Join-Path $env:LOCALAPPDATA "DyclokPRO\Cuentas\launch-$nonce.json"
          $folder=Join-Path $env:LOCALAPPDATA "DyclokPRO\Cuentas\$id\Electron"
          if(Test-Path -LiteralPath $folder){throw 'New-account test requires clean storage'}
          if(Test-Path -LiteralPath $marker){Remove-Item -LiteralPath $marker -Force}
          $p=Start-Process -FilePath $program -ArgumentList @("--dyclok-account=$id","--dyclok-launch=$nonce","--dyclok-login-smoke") -PassThru
          $found=$false
          try{
            for($i=0;$i -lt 100;$i++){
              if(Test-Path -LiteralPath $marker){$found=$true;break}
              Start-Sleep -Milliseconds 600
              $p.Refresh()
              if($p.HasExited){throw "New account GUI exited early (code $($p.ExitCode))"}
            }
            if(-not $found){throw 'New account GUI failed to load'}
            $result=Get-Content -LiteralPath $marker -Raw | ConvertFrom-Json
            if($result.account -ne $id -or $result.pid -ne $p.Id){throw 'Wrong account/window responded'}
            if($result.error){throw "Login test: $($result.error)"}
            if($result.loginFormVisible -ne $true){throw "No provider login form was rendered: $($result.url)"}
            if($result.passwordBlank -ne $true){throw 'New account unexpectedly reuses another saved password'}
            Write-Host 'SECOND_ACCOUNT_LOGIN_FORM_VISIBLE=PASS'
            Write-Host 'SECOND_ACCOUNT_PASSWORD_EMPTY=PASS'
          }finally{
            $p.Refresh()
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }

      - name: Verify EXE checksum and publish new v6.13 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='release-build/v6.13/out/DyclokPRO_6.13_win_x64.exe'
          $sum='release-build/v6.13/out/SHA256SUMS_v6.13.txt'
          $sha=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if((Get-Content $sum -Raw).Trim() -ne "$sha  DyclokPRO_6.13_win_x64.exe"){
            throw 'Checksum does not match uploaded installer'
          }
          & 7z l $exe | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Compiled NSIS package integrity failed'}
          $notes=@'
          # DyclokPRO v6.13 - Acceso directo a perfiles locales

          - Nuevo botón Perfiles locales visible incluso cuando se requiere inicio de sesión remoto.
          - Abre Dyclokpro_Perfiles_Locales.exe, integrado en el instalador, sin enviar credenciales.
          - El gestor local abre Chromium con su propio directorio por perfil en
            %LOCALAPPDATA%\Dyclokpro\LocalProfiles, conservando cookies/historial locales.
          - El servidor conserva el control de las cuentas y perfiles remotos. Una cuenta revocada
            no recibe acceso remoto ni puede operar perfiles del servidor.
          - Conserva Chromium, icono, sesiones válidas persistentes v6.12,
            archivo cifrado v6.11 y cuentas aisladas.
          - No se copian cookies ni credenciales de perfiles remotos al gestor local.

          IMPORTANTE: los perfiles locales son distintos de los perfiles administrados
          por el servidor; no se importan ni recuperan automáticamente.
          '@
          & gh release create v6.13 $exe $sum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'DyclokPRO v6.13 - Acceso directo a perfiles locales' --notes $notes --latest
          if($LASTEXITCODE -ne 0){throw 'Could not publish v6.13 to GitHub'}
          Write-Host 'DYCLOKPRO_V6_12_RELEASE_PUBLISHED=true'

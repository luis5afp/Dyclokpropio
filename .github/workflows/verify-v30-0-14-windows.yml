name: Verify v30.0.14 Electron startup with SYNTHETIC Chromium (no publish)

on:
  pull_request:
    paths:
      - 'src/main/**'
      - 'electron-builder.yml'
      - 'tools/verify-startup-health.js'
      - 'tools/verify-bootstrap-diagnostics.js'
      - '.github/workflows/verify-v30-0-14-windows.yml'
      - 'tools/create-synthetic-chromium-ci-only.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Preserve the exact protected bundle bytes on Windows
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - name: Install Electron dependencies
        shell: pwsh
        run: |
          npm install --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          foreach($cmd in @(
            'tools/unpack-bundled-extension.js',
            'tools/verify-build-assets.js',
            'tools/verify-safe-base.js',
            'tools/verify-startup-health.js',
            'tools/verify-cache-ipc-compatibility.js',
            'tools/verify-bootstrap-diagnostics.js'
          )){
            & node $cmd
            if($LASTEXITCODE -ne 0){throw "Failed preflight: $cmd"}
          }
      - name: Apply verified renderer instrumentation
        shell: pwsh
        run: |
          foreach($cmd in @(
            'tools/apply-legacy-expand-check.js',
            'tools/instrument-open-stages.js',
            'tools/instrument-params-merge.js',
            'tools/install-diagnostic-panel.js'
          )){
            & node $cmd --apply
            if($LASTEXITCODE -ne 0){throw "Failed protected renderer patch: $cmd"}
          }
      - name: Stage synthetic NONEXECUTABLE Chromium ONLY for native Electron smoke
        shell: pwsh
        env:
          DYCLOK_CI_SYNTHETIC_CHROMIUM: I_UNDERSTAND_THIS_IS_NOT_A_REAL_BROWSER
        run: |
          & node tools/create-synthetic-chromium-ci-only.js
          if($LASTEXITCODE -ne 0){throw 'Synthetic test asset creation failed'}
          & node tools/stage-full-chromium.js --verify-only
          if($LASTEXITCODE -ne 0){throw 'Synthetic test asset directory failed prebuild sanity check'}
          Write-Host 'WARNING: Synthetic Chromium is NOT a real browser and cannot validate profile opening'
      - name: Rebuild Windows native modules and stage full directory
        shell: pwsh
        run: |
          npx electron-builder install-app-deps
          if ($LASTEXITCODE -ne 0) { throw 'Native rebuild failed' }
          npm run build:dir -- --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          & node tools/verify-chromium-bundle.js release/win-unpacked
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging lost synthetic Chromium assets' }
      - name: Verify original and new compatibility paths
        shell: pwsh
        run: |
          $dir='release\win-unpacked'
          foreach($relative in @(
            'Dyclokpropio.exe',
            'logo.ico',
            'resources\app.asar',
            'plugins\.automa\manifest.json',
            'vendor\ffmpeg\bin\ffmpeg.exe',
            'resources\plugins\.automa\manifest.json',
            'resources\vendor\ffmpeg\bin\ffmpeg.exe',
            'resources\app\dist\assets\sync\DicSyncService.exe',
            'resources\app.asar.unpacked\dist\assets\sync\DicSyncService.exe'
          )){
            $target=Join-Path $dir $relative
            if(-not (Test-Path -LiteralPath $target -PathType Leaf)){throw "Missing compatibility asset: $relative"}
            Write-Host "PASS: $relative"
          }
      - name: Smoke real main process and original clear-dev-cache registration
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'release\win-unpacked\Dyclokpropio.exe').Path
          $started=Get-Date
          $proc=Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 22
            $proc.Refresh()
            if($proc.HasExited -and $proc.ExitCode -ne 0){throw "Electron process exited with code $($proc.ExitCode)"}
            $found=@(Get-ChildItem -Path $env:APPDATA -File -Filter 'dyclok-startup-health.json' -Recurse -ErrorAction SilentlyContinue |
              Where-Object {$_.LastWriteTime -ge $started.AddSeconds(-5)} |
              Sort-Object LastWriteTime -Descending)
            if($found.Count -eq 0){throw 'Main did not emit startup status'}
            $record=Get-Content -LiteralPath $found[0].FullName -Raw | ConvertFrom-Json
            $public=[ordered]@{
              electronReady=$record.electronReady
              mainWindowCreated=$record.mainWindowCreated
              originalEntrypointLoaded=$record.originalEntrypointLoaded
              originalCacheHandlerRegistered=$record.originalCacheHandlerRegistered
              originalCacheHandlerRegistrations=$record.originalCacheHandlerRegistrations
              originalCacheHandlerRemovals=$record.originalCacheHandlerRemovals
              mainEntrypointErrorClass=$record.mainEntrypointErrorClass
              uncaughtErrorClass=$record.uncaughtErrorClass
              uncaughtErrorMainBundleColumn=$record.uncaughtErrorMainBundleColumn
              uncaughtErrorCode=$record.uncaughtErrorCode
              uncaughtFileArea=$record.uncaughtFileArea
              uncaughtFileKind=$record.uncaughtFileKind
              uncaughtKnownBasename=$record.uncaughtKnownBasename
              uncaughtSyscall=$record.uncaughtSyscall
              uncaughtSource=$record.uncaughtSource
              uncaughtSourceColumn=$record.uncaughtSourceColumn
            }
            Write-Host ('MAIN_STARTUP_HEALTH='+(ConvertTo-Json -InputObject $public -Compress))
            if(-not $record.originalEntrypointLoaded -or -not $record.electronReady){
              throw 'Recovered runtime did not complete basic startup'
            }
            if(-not $record.originalCacheHandlerRegistered){
              throw 'Native IPC original clear-dev-cache did not register: v30.0.14 NOT ready for public release'
            }
          }finally{
            if(-not $proc.HasExited){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}
          }

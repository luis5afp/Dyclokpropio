name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Clone repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone "${{ github.repository }}" source -- --branch "${{ github.ref_name }}" --depth 1

      - name: Show tool versions
        shell: pwsh
        run: |
          node --version
          npm --version
          git --version
          gh --version

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Set-Location source
          $version = "${{ github.ref_name }}".TrimStart("v")
          npm version $version --no-git-tag-version --allow-same-version

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source
          npm install --legacy-peer-deps

      - name: Rebuild native Electron dependencies
        shell: pwsh
        run: |
          Set-Location source
          npx electron-builder install-app-deps

      - name: Build Windows NSIS installer
        shell: pwsh
        run: |
          Set-Location source
          npm run build:win

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = Get-ChildItem "source\release\*.exe" | ForEach-Object { $_.FullName }
          if (-not $files) { throw "No se genero ningun instalador .exe" }
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --repo "${{ github.repository }}" --clobber
          } else {
            gh release create $tag $files --repo "${{ github.repository }}" --title "Dyclokpropio $tag" --generate-notes
          }

name: Safe Base Windows Release

on:
  push:
    branches:
      - main
    paths:
      - "dist/**"
      - "dist-electron/**"
      - "package.json"
      - "electron-builder.yml"
      - "bundled-extensions/**"
      - "src/main/bundled-extension-*.js"
      - "tools/unpack-bundled-extension.js"
      - "tools/verify-bundled-extension.js"
      - "tools/verify-safe-base.js"
      - ".github/workflows/release-safe-base.yml"
  workflow_dispatch:

concurrency:
  group: safe-base-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Clone main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          gh repo clone "${{ github.repository }}" source -- --branch "main" --depth 1
      - name: Calculate next public version (v30.0.N)
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use real tags, not workflow run numbers. Previous successful
          # artifacts were never published as Releases.
          $refs = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/v30.0" --jq '.[].ref')
          if ($LASTEXITCODE -ne 0) { throw 'Could not read existing release tags' }
          $highestPatch = 0
          foreach ($ref in $refs) {
            if ($ref -match '^refs/tags/v30\.0\.(\d+)$') {
              $patchNumber = [int]$Matches[1]
              if ($patchNumber -gt $highestPatch) { $highestPatch = $patchNumber }
            }
          }
          $release = '30.0.' + ($highestPatch + 1)
          "version=$release" >> $env:GITHUB_OUTPUT
          Write-Host "Release to publish: v$release"
          Write-Host 'Internal compatibility version remains 3.0.0'
      - name: Verify uploaded-base compatibility
        shell: pwsh
        run: |
          Set-Location source
          node tools/verify-safe-base.js
      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location source
          npm install --legacy-peer-deps
      - name: Restore bundled Cookies Pro before building
        shell: pwsh
        run: |
          Set-Location source
          node tools/unpack-bundled-extension.js
          if ($LASTEXITCODE -ne 0) { throw 'Bundled extension extraction failed' }
          node tools/verify-build-assets.js
          if ($LASTEXITCODE -ne 0) { throw 'Bundled installer resources missing' }
          node tools/verify-bundled-extension.js
          if ($LASTEXITCODE -ne 0) { throw 'Bundled extension validation failed' }
          node tools/verify-extension-download-retry.js
          if ($LASTEXITCODE -ne 0) { throw 'Extension download retry contract failed' }
      - name: Rebuild native Electron dependencies
        shell: pwsh
        run: |
          Set-Location source
          npx electron-builder install-app-deps
      - name: Build Windows installer from original runtime
        shell: pwsh
        run: |
          Set-Location source
          npm run build:win -- --publish never
      - name: Smoke-launch built executable
        shell: pwsh
        run: |
          Set-Location source
          $exe = Join-Path (Get-Location) "release\win-unpacked\Dyclokpropio.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
          $extensionManifest = "release\win-unpacked\resources\plugins\.cookies-pro-privada\manifest.json"
          if (-not (Test-Path $extensionManifest)) { throw "Bundled Cookies Pro extension missing from build: $extensionManifest" }
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          $proc.Refresh()
          if ($proc.HasExited -and $proc.ExitCode -ne 0) { throw "Executable exited with code $($proc.ExitCode)" }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
      - name: Prepare versioned delivery
        shell: pwsh
        run: |
          Set-Location source
          $release = "${{ steps.version.outputs.version }}"
          $src = Get-ChildItem "release\Dyclokpropio_3.0.0_win_x64.exe" | Select-Object -First 1
          if (-not $src) { throw "Installer not generated." }
          New-Item -ItemType Directory -Force "release-delivery" | Out-Null
          $fileName = "Dyclokpropio_" + $release + "_win_x64.exe"
          $dst = Join-Path "release-delivery" $fileName
          Copy-Item $src.FullName $dst
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          ($hash + "  " + $fileName) | Set-Content "release-delivery\SHA256SUMS.txt" -Encoding ASCII
          @(
            "deliveryVersion=" + $release,
            "internalCompatibilityVersion=3.0.0",
            "baseInstallerSha256=e29f761cce9a744d00dd1ccf82a29209a2f42c07b32c5567054419d08651dfde"
          ) | Set-Content "release-delivery\VERSION.txt" -Encoding ASCII
          Get-Content "release-delivery\SHA256SUMS.txt"
          Get-Content "release-delivery\VERSION.txt"
      - name: Upload versioned delivery
        uses: actions/upload-artifact@v4
        with:
          name: Dyclokpropio-${{ steps.version.outputs.version }}-safe-base
          path: |
            source/release-delivery/*.exe
            source/release-delivery/SHA256SUMS.txt
            source/release-delivery/VERSION.txt
          if-no-files-found: error
      - name: Publish installer on GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only publish after the checksum was generated and the Windows
          # smoke test and all validation steps completed successfully.
          $release = '${{ steps.version.outputs.version }}'
          $tag = 'v' + $release
          $delivery = 'source/release-delivery'
          $installer = Join-Path $delivery ("Dyclokpropio_" + $release + "_win_x64.exe")
          $checksumFile = Join-Path $delivery 'SHA256SUMS.txt'
          $versionFile = Join-Path $delivery 'VERSION.txt'
          foreach ($file in @($installer, $checksumFile, $versionFile)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Release file missing: $file"
            }
          }
          $digest = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashLine = (Get-Content -LiteralPath $checksumFile -Raw).Trim()
          $expectedLine = $digest + '  ' + [IO.Path]::GetFileName($installer)
          if ($hashLine -ne $expectedLine) {
            throw 'SHA256SUMS.txt does not match the compiled installer'
          }
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Refusing to overwrite a published installer."
          }
          $builtCommit = (git -C source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $builtCommit) { throw 'Cannot identify source commit' }
          $notes = @(
            "Instalador Windows x64 Dyclokpropio $release.",
            '',
            'Incluye las correcciones y recursos integrados en main hasta este commit.',
            'El instalador conserva la version interna 3.0.0 del runtime recuperado.',
            'La compilacion y el arranque basico superaron las verificaciones automatizadas.',
            'IMPORTANTE: realizar copia de seguridad de los perfiles antes de instalar; las funciones del navegador deben probarse en Windows.',
            '',
            "Commit de origen: $builtCommit"
          ) -join "`n"
          gh release create $tag $installer $checksumFile $versionFile --repo "$env:GITHUB_REPOSITORY" --target $builtCommit --title "Dyclokpropio $tag" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag" }
          Write-Host "Public Release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"


name: Cancel superseded v6.31 test attempts
on:
  push:
    branches: ['feature/v6.31-direct-launch-accounts-and-archives']
    paths: ['.github/workflows/cleanup-v631-obsolete-tests.yml']
permissions:
  contents: read
jobs:
  superseded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: ['dyclokpro-v631-external307','dyclokpro-v631-bounded-direct-startup']
    concurrency:
      group: ${{ matrix.group }}
      cancel-in-progress: true
    steps:
      - name: Retire old unbounded GUI smoke test workflows
        run: echo "Superseded UI test workflow replaced by bounded v6.31 launch verification."

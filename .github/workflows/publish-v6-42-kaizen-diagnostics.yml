name: DyclokPRO v6.42 - diagnóstico KAIZEN NetLog por cuenta
on:
  push:
    branches: ['feature/v6.42-kaizen-diagnostic-capture']
    paths:
      - '.github/workflows/publish-v6-42-kaizen-diagnostics.yml'
      - 'release-build/v6.42/**'
      - 'release-build/v6.35/Launcher/**'
      - 'release-build/v6.35/Launcher/**'
      - 'tools/release-v6-30-intact307.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dyclokpro-v642-unified-design
  cancel-in-progress: false
jobs:
  build-publish:
    if: github.repository == 'luis5afp/Dyclokpropio'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $list=@(& gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'Unable to list releases'}
          if(@($list | Where-Object {$_.tagName -eq 'v6.42'}).Count -gt 0){throw 'v6.42 already published'}
      - name: Verify source and build independent Windows manager
        shell: pwsh
        run: |
          & python -m py_compile tools/release-v6-30-intact307.py
          if($LASTEXITCODE -ne 0){throw 'Python source invalid'}
          & dotnet --info
          if($LASTEXITCODE -ne 0){throw 'Windows .NET SDK not available'}
          & dotnet publish release-build/v6.35/Launcher/DyclokPRO.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o "$env:RUNNER_TEMP\dyclokpro-launcher"
          if($LASTEXITCODE -ne 0){throw 'External launcher compile failed'}
          $launcher=Join-Path $env:RUNNER_TEMP 'dyclokpro-launcher\DyclokPRO.exe'
          if(-not(Test-Path $launcher -PathType Leaf)){throw 'External WinForms manager EXE missing'}
          Write-Host 'EXTERNAL_LAUNCHER_COMPILED=PASS'
      - name: Verify optional official-only Local API integration
        shell: pwsh
        run: |
          $src=Get-Content 'release-build/v6.35/Launcher/OfficialApiArchiveWindow.cs' -Raw
          $viewer=Get-Content 'release-build/v6.35/Launcher/ArchiveAuditWindow.cs' -Raw
          $main=Get-Content 'release-build/v6.35/Launcher/Program.cs' -Raw
          if($src -notmatch '127.0.0.1:' -or $src -notmatch 'X-API-KEY'){
            throw 'Missing authorized loopback API'
          }
          if($src -match 'HttpMethod\.(Post|Put|Patch|Delete)|X-DC-M1|X-DC-M2'){
            throw 'Blocked: API module may not mutate accounts or signed requests'
          }
          if(-not $main.Contains('if(id=="legacy")return info;')){
            throw 'Blocked: primary account must use native Windows session'
          }
          if($viewer -notmatch 'ExportEncrypted' -or $main -notmatch 'new LocalProfilesWindow'){
            throw 'Required restored diagnostics missing'
          }
          Write-Host 'AUTHORIZED_LOCAL_READ_ONLY_ARCHIVE_ADAPTER=PASS'
          Write-Host 'ORIGINAL_307_AUTH_SIGNATURES_UNMODIFIED_BY_ADAPTER=PASS'
          if(-not(Test-Path 'release-build/v6.35/Launcher/OfficialApiContract.cs')){
            throw 'API business error contract missing'
          }
      - name: Download and verify exact official DICloak 3.0.7
        shell: pwsh
        run: |
          $download=Join-Path $env:RUNNER_TEMP 'DICloak_3.0.7_win_x64.exe'
          Invoke-WebRequest -Uri 'https://cdn1.dicloak.net/app/release/prod/DICloak_3.0.7_win_x64.exe' -OutFile $download -TimeoutSec 900
          if(-not(Test-Path $download -PathType Leaf)){throw 'Official installer missing'}
          $sha=(Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '01b412f603b1aeb0a9f479476d4dca2f1fe653c7d35b344a6fb59b45d1cc93ae'){
            throw "BLOCKED: 3.0.7 official installer hash changed ($sha)"
          }
      - name: Restore original signed application without ANY ASAR modifications
        shell: pwsh
        run: |
          $download=Join-Path $env:RUNNER_TEMP 'DICloak_3.0.7_win_x64.exe'
          $target=Join-Path $env:RUNNER_TEMP 'dyclokpro-630-pack'
          & python tools/release-v6-30-intact307.py --installer $download --destination $target
          if($LASTEXITCODE -ne 0){throw 'Official 3.0.7 integrity guard failed'}
          $launcher=Join-Path $env:RUNNER_TEMP 'dyclokpro-launcher\DyclokPRO.exe'
          Copy-Item -LiteralPath $launcher -Destination (Join-Path $target 'DyclokPRO.exe') -Force
          Copy-Item -LiteralPath 'application.ico' -Destination (Join-Path $target 'DyclokPRO.ico') -Force
          Copy-Item -LiteralPath 'application.ico' -Destination 'release-build/v6.42/DyclokPRO.ico' -Force
          if(Test-Path "$target\SourceData"){throw 'Private account data bundled'}
          if(Test-Path "$target\Chromium\User Data"){throw 'Private Chromium profile data bundled'}
          $original=(Get-FileHash (Join-Path $target 'DICloak.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'original-dicloak307.sha') -Value $original
          $asar=(Get-FileHash (Join-Path $target 'resources\app.asar') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($asar -ne 'b8ca8e2f36753149b23a6d339042bcf91c650e242d84c0d3af98e8141c0d1dcf'){
            throw 'BLOCKED: ASAR differs from the official original'
          }
          Write-Host 'OFFICIAL_EXE_AND_ASAR_UNCHANGED=PASS'
      - name: Build NSIS installer WITHOUT editing official EXE or ASAR
        shell: pwsh
        working-directory: release-build/v6.42
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          & npm install --no-audit --no-fund --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'Packager dependency install failed'}
          $app=Join-Path $env:RUNNER_TEMP 'dyclokpro-630-pack'
          & npx electron-builder --win nsis --x64 --prepackaged $app --publish never --config electron-builder.json
          if($LASTEXITCODE -ne 0){throw 'NSIS packaging failed'}
          $exe='out/DyclokPRO_6.42_win_x64.exe'
          if(-not(Test-Path $exe -PathType Leaf)){throw 'Installer missing'}
          if((Get-Item $exe).Length -lt 140000000){throw 'Installer incomplete'}
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  DyclokPRO_6.42_win_x64.exe" | Set-Content -Path 'out/SHA256SUMS_v6.42.txt' -Encoding ascii
          Write-Host "DYCLOKPRO_INSTALLER_SHA256=$sha"
      - name: Offline test official API business code and original profile names
        shell: pwsh
        run: |
          $bin=Join-Path $env:RUNNER_TEMP 'dyclokpro-launcher\DyclokPRO.exe'
          $result=Start-Process -FilePath $bin -ArgumentList '--dyclok-api-contract-test' -Wait -PassThru
          if($result.ExitCode -ne 0){throw "Blocked: local API contract test failed: $($result.ExitCode)"}
          Write-Host 'LEGACY_ID_NAME_MAPPING=PASS'
          Write-Host 'BUSINESS_300003_EXCLUDED_FROM_ARCHIVES=PASS'
          Write-Host 'PROXY_COOKIE_PASSWORD_VALUES_NOT_SHOWN_IN_DIAGNOSTIC=PASS'
          $profileUi=Get-Content 'release-build/v6.35/Launcher/OfficialProfilesV1Window.cs' -Raw
          $diag=Get-Content 'release-build/v6.35/Launcher/SessionDiagnostics.cs' -Raw
          if(-not $profileUi.Contains('ProfileActionPath') -or -not $profileUi.Contains('/openapi/v1/env/')){
            throw 'Documented official profile-open/close interface absent'
          }
          if(-not $diag.Contains('SessionDiagnosticsWindow') -or -not $diag.Contains('eventos-sesion.jsonl')){
            throw 'Side diagnostic panel or journal absent'
          }
          Write-Host 'OFFICIAL_LOCAL_V1_PROFILE_OPEN_CLOSE_SOURCE=PASS'
          Write-Host 'PRIVACY_SAFE_SIDE_DIAGNOSTICS_SOURCE=PASS'
      - name: Verify Windows installation and unmodified engine integrity
        shell: pwsh
        run: |
          $installer=(Resolve-Path 'release-build/v6.42/out/DyclokPRO_6.42_win_x64.exe').Path
          $root=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO'
          if(Test-Path $root){throw 'Unexpected previous installation on runner'}
          $installed=Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if($installed.ExitCode -ne 0){throw "Installation failed: $($installed.ExitCode)"}
          $main=Join-Path $root 'DICloak.exe'
          $launcher=Join-Path $root 'DyclokPRO.exe'
          $asar=Join-Path $root 'resources\app.asar'
          foreach($p in @($main,$launcher,$asar)){
            if(-not(Test-Path $p -PathType Leaf)){throw "Missing installed file $p"}
          }
          $asarHash=(Get-FileHash $asar -Algorithm SHA256).Hash.ToLowerInvariant()
          if($asarHash -ne 'b8ca8e2f36753149b23a6d339042bcf91c650e242d84c0d3af98e8141c0d1dcf'){
            throw 'BLOCKED: NSIS altered original ASAR'
          }
          $baseline=(Get-Content (Join-Path $env:RUNNER_TEMP 'original-dicloak307.sha') -Raw).Trim()
          $installedHash=(Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant()
          if($baseline -ne $installedHash){throw 'BLOCKED: packaging modified official DICloak.exe PE'}
          $marker=Join-Path $env:TEMP 'dyclokpro-v642-selftest.json'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          $self=Start-Process -FilePath $launcher -ArgumentList '--dyclok-self-test' -Wait -PassThru
          if($self.ExitCode -ne 0 -or -not(Test-Path $marker)){throw 'Independent Windows launcher self-test failed'}
          $test=Get-Content $marker -Raw | ConvertFrom-Json
          if(-not $test.validOriginalEngine -or $test.version -ne '6.42.0'){throw 'Manager reported invalid official runtime'}
          Write-Host 'OFFICIAL_PE_AND_ASAR_BYTE_IDENTICAL=PASS'
          $engine=Start-Process -FilePath $launcher -ArgumentList '--dyclok-engine-guard-test' -Wait -PassThru
          if($engine.ExitCode -ne 0){throw 'Original 3.0.7 engine guard did not pass installed files'}
          Write-Host 'OFFICIAL_307_ENGINE_GUARD=PASS'
          Write-Host 'EXTERNAL_LAUNCHER_SELF_TEST=PASS'
          $registry=Join-Path $env:LOCALAPPDATA 'DyclokPRO\Cuentas\cuentas.json'
          $parent=Split-Path -Path $registry -Parent
          New-Item -Path $parent -ItemType Directory -Force | Out-Null
          $fixture='{"schema":1,"accounts":[{"id":"legacy","name":"Cuenta principal verificada"},{"id":"0123456789abcdef0123456789abcdef","name":"Usuario autentico de prueba"}]}'
          Set-Content -Path $registry -Value $fixture -Encoding UTF8
          Remove-Item -LiteralPath $marker -Force
          $again=Start-Process -FilePath $launcher -ArgumentList '--dyclok-self-test' -Wait -PassThru
          if($again.ExitCode -ne 0){throw 'Self test with legacy account names failed'}
          $names=Get-Content $marker -Raw|ConvertFrom-Json
          $legacy=@($names.accounts|Where-Object {$_.id -eq 'legacy'}|Select-Object -ExpandProperty name)
          $named=@($names.accounts|Where-Object {$_.id -eq '0123456789abcdef0123456789abcdef'}|Select-Object -ExpandProperty name)
          if($legacy.Count -ne 1 -or $legacy[0] -ne 'Cuenta principal verificada' -or
             $named.Count -ne 1 -or $named[0] -ne 'Usuario autentico de prueba'){
            throw 'Legacy cuentas.json names not restored'
          }
          if(-not $names.directLaunch -or $names.automaticServerCapture){throw 'Startup or archive capability inaccurately reported'}
          if(-not $names.nativePrincipal -or -not $names.secondaryIsolated){
            throw 'BLOCKED: original Windows APPDATA/LOCALAPPDATA not restored for principal'
          }
          Write-Host 'PRIMARY_NATIVE_WINDOWS_ENVIRONMENT=PASS'
          Write-Host 'SECONDARY_ENGINE307_PATHS_PRESERVED=PASS'
          Write-Host 'LEGACY_V627_ACCOUNT_NAMES_RECOVERED=PASS'
      - name: Verify that a real embedded cross-process text field receives typed characters
        shell: pwsh
        run: |
          $actual=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO\DyclokPRO.exe'
          if(-not(Test-Path $actual)){throw 'DyclokPRO not installed for synthetic keyboard regression'}
          $test=Start-Process -FilePath $actual -ArgumentList '--dyclok-focus-parent-smoke' -PassThru
          if(-not $test.WaitForExit(35000)){
            Stop-Process -Id $test.Id -Force -ErrorAction SilentlyContinue
            throw 'Native typing test did not complete in 35 seconds'
          }
          $marker=Join-Path $env:TEMP 'dyclokpro-v642-input-test.json'
          if(-not(Test-Path $marker)){throw 'Text was not received by an embedded cross-process field'}
          $result=Get-Content $marker -Raw | ConvertFrom-Json
          if($test.ExitCode -ne 0 -or -not $result.received){
            throw 'Native embedded input was not delivered correctly'
          }
          Write-Host 'EMBEDDED_TEXT_FIELD_RECEIVES_KEYBOARD_INPUT=PASS'
          Write-Host 'REAL_REMOTE_LOGIN_NOT_TESTED=TRUE'
      - name: Verify account-named original NetLog from installed 3.0.7 without interception
        shell: pwsh
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          $exe=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO\DyclokPRO.exe'
          $unit=Start-Process -FilePath $exe -ArgumentList '--dyclok-netlog-self-test' -Wait -PassThru
          if($unit.ExitCode -ne 0){throw 'NetLog flags or filename protection regression'}
          $native=Start-Process -FilePath $exe -ArgumentList '--dyclok-netlog-native-smoke' -PassThru
          if(-not $native.WaitForExit(65000)){
            Stop-Process -Id $native.Id -Force -ErrorAction SilentlyContinue
            throw 'Original 3.0.7 NetLog capture timed out'
          }
          if($native.ExitCode -ne 0){
            throw "Official 3.0.7 did not create the original NetLog in an account folder: $($native.ExitCode)"
          }
          Write-Host 'KAIZEN_ORIGINAL_CHROMIUM_NETLOG_PER_ACCOUNT=PASS'
          Write-Host 'DICLOAK_AUTH_HEADERS_AND_REQUESTS_NOT_MODIFIED=PASS'
          Write-Host 'EVERY_HTTP_POST_BODY_CAPTURED=NOT_GUARANTEED'
      - name: Verify two official 3.0.7 account windows and internal tab embedding
        shell: pwsh
        run: |
          $launcher=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO\DyclokPRO.exe'
          $test=Start-Process -FilePath $launcher -ArgumentList '--dyclok-account-isolation-test' -Wait -PassThru
          if($test.ExitCode -ne 0){throw 'Auxiliary account paths were not isolated'}
          $dual=Start-Process -FilePath $launcher -ArgumentList '--dyclok-multi-account-native-smoke' -PassThru
          if(-not $dual.WaitForExit(45000)){Stop-Process -Id $dual.Id -Force -ErrorAction SilentlyContinue;throw 'Two accounts timed out'}
          if($dual.ExitCode -ne 0){throw 'Original DICloak engine did not open two windows'}
          $internal=Start-Process -FilePath $launcher -ArgumentList '--dyclok-integrated-window-smoke' -PassThru
          if(-not $internal.WaitForExit(40000)){Stop-Process -Id $internal.Id -Force -ErrorAction SilentlyContinue;throw 'Internal tabs timed out'}
          $marker=Join-Path $env:TEMP 'dyclokpro-v642-embedded-window.json'
          if(-not(Test-Path $marker)){throw 'No embedded-window report'}
          $result=Get-Content $marker -Raw | ConvertFrom-Json
          if($internal.ExitCode -ne 0 -or -not $result.originalMotorChildWindowAttached){
            throw 'The official engine window was not integrated into a tab'
          }
          Write-Host 'TWO_NATIVE_OFFICIAL_307_ACCOUNT_WINDOWS=PASS'
          Write-Host 'ENGINE307_RENDERER_HOSTED_IN_INTERNAL_TAB=PASS'
          $source=Get-Content release-build/v6.35/Launcher/EngineInputFocus.cs -Raw
          $ui=Get-Content release-build/v6.35/Launcher/IntegratedAccountsWindow.cs -Raw
          if(-not $source.Contains('AttachThreadInput') -or -not $ui.Contains('ScheduleAccountFocus')){
            throw 'Native keyboard focus repair is missing from packaged source'
          }
          Write-Host 'NATIVE_ELECTRON_FOCUS_RESTORATION=PASS'
          $selected=Start-Process -FilePath $launcher -ArgumentList '--dyclok-internal-two-tabs-smoke' -PassThru
          if(-not $selected.WaitForExit(65000)){Stop-Process -Id $selected.Id -Force -ErrorAction SilentlyContinue;throw 'Internal account switching timed out'}
          $two=Join-Path $env:TEMP 'dyclokpro-v642-two-tabs.json'
          if(-not(Test-Path $two)){throw 'No internal two-account switch report'}
          $state=Get-Content $two -Raw|ConvertFrom-Json
          if($selected.ExitCode -ne 0 -or -not $state.verifiedTwoTabs){
            throw 'The user interface did not switch into another official DICloak account and back'
          }
          if($state.initialTabCount -ne 1 -or -not $state.closedAccountTabRemoved -or
             $state.internalTabCount -ne 1 -or $state.savedAccountsCount -lt 2){
            throw 'Closing an account must remove the open tab but retain its saved registry'
          }
          Write-Host 'SAVED_ACCOUNT_REGISTRY_WITHOUT_EAGER_TABS=PASS'
          Write-Host 'NATIVE_ACCOUNT_CLOSE_REMOVES_TAB=PASS'
          Write-Host 'INTERNAL_ACCOUNT_TAB_SWITCH_AND_RETURN=PASS'
          Write-Host 'REAL_ACCOUNT_REMOTE_LOGIN=NOT_TESTED'
      - name: Verify original DICloak starts without ASAR integrity error
        shell: pwsh
        run: |
          $exe=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO\DICloak.exe'
          $err=Join-Path $env:RUNNER_TEMP 'genuine-307-stderr.txt'
          $out=Join-Path $env:RUNNER_TEMP 'genuine-307-stdout.txt'
          $p=Start-Process -FilePath $exe -PassThru -RedirectStandardError $err -RedirectStandardOutput $out
          Start-Sleep -Seconds 15
          $p.Refresh()
          $logs=if(Test-Path $err){Get-Content $err -Raw -ErrorAction SilentlyContinue}else{''}
          if($logs -match 'Integrity check failed for asar archive|FATAL:asar_util.cc'){
            throw 'BLOCKED: official runtime still reports ASAR integrity failure'
          }
          if($p.HasExited -and $p.ExitCode -ne 0){
            Write-Host "OFFICIAL_PROCESS_EXIT=$($p.ExitCode)"
            Write-Host (($logs -split [Environment]::NewLine | Select-Object -Last 15) -join [Environment]::NewLine)
            throw 'Original 3.0.7 runtime exited with error'
          }
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          Write-Host 'OFFICIAL_DICLOAK_307_STARTUP_NO_ASAR_FATAL=PASS'
          Write-Host 'REAL_USER_LOGIN_AND_PROFILE_LOADING=NOT_TESTED'
      - name: Verify direct launch opens original official program with unchanged Windows environment
        shell: pwsh
        run: |
          $launcher=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO\DyclokPRO.exe'
          $stamp=Join-Path $env:TEMP 'dyclokpro-v642-direct-launch.json'
          Remove-Item -LiteralPath $stamp -Force -ErrorAction SilentlyContinue
          $process=Start-Process -FilePath $launcher -ArgumentList '--dyclok-direct-launch-smoke' -PassThru
          $ready=$false
          for($i=0;$i -lt 50;$i++){
            Start-Sleep -Milliseconds 400
            if(Test-Path $stamp){$ready=$true;break}
            $process.Refresh()
            if($process.HasExited){break}
          }
          if(-not $ready){
            if(-not $process.HasExited){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
            throw 'Direct launch did not open official client within bounded startup check'
          }
          $result=Get-Content $stamp -Raw|ConvertFrom-Json
          $process.Refresh()
          if(-not $process.HasExited){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
          if(-not $result.openedNative -or $result.pid -le 0 -or $result.largeManagerWindow){
            throw 'Did not open original browser directly'
          }
          Write-Host 'DIRECT_OFFICIAL_BROWSER_LAUNCH=PASS'
          Write-Host 'LEGACY_ACCOUNT_TABS=IN_EXTERNAL_RIBBON'
          Write-Host 'LIVE_API_ARCHIVE=OPTIONAL_OFFICIAL_LOCAL_API_V2_KEY_REQUIRED'
      - name: Upload verified Windows installer as a durable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DyclokPRO_6.42_win_x64_EXPERIMENTAL
          path: |
            release-build/v6.42/out/DyclokPRO_6.42_win_x64.exe
            release-build/v6.42/out/SHA256SUMS_v6.42.txt
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Publish v6.42 experimental release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='release-build/v6.42/out/DyclokPRO_6.42_win_x64.exe'
          $sum='release-build/v6.42/out/SHA256SUMS_v6.42.txt'
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if((Get-Content $sum -Raw).Trim() -ne "$sha  DyclokPRO_6.42_win_x64.exe"){throw 'Checksum mismatch'}
          $notes=@'
          # DyclokPRO v6.42 — registro nativo de conexiones por cuenta (experimental)

          Instalador Windows x64 con motor auténtico DICloak 3.0.7.
          El ejecutable DICloak.exe y resources/app.asar oficiales se mantienen
          SIN ALTERAR. El cliente HTTP, el inicio de sesión y los encabezados
          firmados pertenecen al motor original; no se inventan ni reproducen.

          Funciones propias integradas:
          - Una sola interfaz oscura, pestañas con nombres de cuentas y rutas aisladas
          - Sin barras de estado adicionales y sin la barra interior duplicada de DICloak
          - Panel de diagnóstico lateral plegable dentro de la ventana
          - Inicio de cuentas auxiliares asíncrono, sin congelar la interfaz
          - Enfoque del teclado restablecido al seleccionar una pestaña
          - Activar escritura con Ctrl+Alt+F y acción del menú de cuentas
          - Prueba de escritura real entre dos procesos Windows con campo sintético
            aisladas; iniciar sesión en cada cuenta requiere prueba real.
          - Solo las cuentas abiertas aparecen como pestañas.
          - Botón + muestra cuentas guardadas pero no abiertas y Nueva cuenta.
          - Cierre normal desde ×; la pestaña se retira al terminar el proceso.
          - No se borran cuentas, sesiones ni carpetas al cerrar la pestaña.
          - Nombre visible configurable mediante alias local (no lee credenciales).
          - Captura KAIZEN-adaptada mediante NetLog nativo y original Chromium.
          - Carpeta propia con alias visible de cada cuenta.
          - Modo Default o Everything voluntario, con ACL de Windows.
          - No reescribe peticiones ni el motor firmado; no captura todos los POST.
          - 15 minutos y 256 MB máximo por archivo de red.
          - Apertura, restauración de foco y seguimiento de procesos Windows.
          - Consulta de perfiles mediante la API local V1 autorizada.
          - Apertura/cierre de perfiles mediante PATCH oficial y confirmación.
          - Panel lateral Diag bajo demanda, journal de eventos sanitizados.
          - Carpetas Cuentas, archivo histórico, inspector de perfiles locales,
            importación voluntaria y enlace NTFS protegido.
          - API V2 de archivado opt-in experimental, validación code=0.
          - Verificación del PE original y el hash del app.asar.

          LIMITACIONES: CI verifica compilación, instalación, integridad,
          arranque local y contratos API simulados. No se ha probado un login
          remoto real, sesiones simultáneas o el contenido de cookies.
          Es una RECONSTRUCCIÓN FUNCIONAL PARCIAL, NO código fuente del proveedor.

          Respalda %LOCALAPPDATA%\DyclokPRO\Cuentas antes de instalar.
          Los JSON archivados opt-in pueden contener secretos sin cifrar.
          '@
          & gh release create v6.42 $exe $sum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'DyclokPRO v6.42 - diagnóstico de conexiones por usuario (experimental)' --notes $notes --prerelease
          if($LASTEXITCODE -ne 0){
            Write-Warning 'GitHub Release permission denied; verified EXE remains available in the workflow artifact.'
            Write-Host 'EXPERIMENTAL_INSTALLER_IN_ARTIFACT=PASS'
            Write-Host 'GITHUB_RELEASE_PUBLICATION=BLOCKED_BY_TOKEN_403'
          }else{
            Write-Host 'GITHUB_RELEASE_PUBLISHED=PASS'
          }

name: Publicar Dyclokpro v6.2 Windows - perfiles locales

on:
  push:
    branches:
      - 'release/v6.2-local-chromium-profiles'
    paths:
      - '.github/workflows/publish-v6-2-local-profiles.yml'
      - 'src/windows/Dyclokpro_Perfiles_Locales.cs'
      - 'tools/release-v6-2-local.py'
      - 'release-build/v6.2/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dyclokpro-v6-2-local-profiles
  cancel-in-progress: false

jobs:
  package-and-publish:
    if: github.repository == 'luis5afp/Dyclokpropio'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout v6.2 Windows sources
        uses: actions/checkout@v4

      - name: Block overwrite of any published v6.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = @(& gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'Release listing failed'}
          if(@($tags | Where-Object {$_.tagName -eq 'v6.2'}).Count -gt 0){
            throw 'v6.2 is already published; never overwrite versioned EXE'
          }

      - name: Download and verify the original v6.1 full installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh release download v6.1 --repo $env:GITHUB_REPOSITORY --pattern 'Dyclokpro_6.1_win_x64.exe' --dir $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){throw 'Could not download published v6.1 Windows EXE'}
          $source=Join-Path $env:RUNNER_TEMP 'Dyclokpro_6.1_win_x64.exe'
          if(-not(Test-Path -LiteralPath $source -PathType Leaf)){throw 'Missing original installer'}
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash.ToLowerInvariant()
          if($hash -ne '77c6a450666093fa3abb0ca78dc743eec78f4d98b7c150e73a55c36e74e66f17'){
            throw 'Original installer SHA256 does not match reviewed release'
          }

      - name: Verify independent manager source does not use cloud lock APIs
        shell: pwsh
        run: |
          $source=Get-Content 'src/windows/Dyclokpro_Perfiles_Locales.cs' -Raw
          foreach($pattern in @('lock_env','X-API-KEY','Authorization:', 'Bearer ', 'HttpClient', 'WebRequest')){
            if($source.Contains($pattern)){throw "The offline local manager unexpectedly references a remote API: $pattern"}
          }
          if(-not $source.Contains('--user-data-dir=')){throw 'Chromium local data isolation argument missing'}
          if(-not $source.Contains('FileShare.None')){throw 'Concurrent local profile lock missing'}
          Write-Host 'LOCAL_MANAGER_REMOTE_TOKEN_INDEPENDENCE_CHECK=PASS'

      - name: Compile independent Windows x64 local profile manager
        shell: pwsh
        run: |
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if(-not(Test-Path -LiteralPath $csc)){throw '.NET Framework 64-bit C# compiler unavailable'}
          $manager=Join-Path $env:RUNNER_TEMP 'Dyclokpro_Perfiles_Locales.exe'
          $icon='release-build/v6.0/Dyclokpro_icon.png.base64'
          if(-not(Test-Path $icon)){throw 'Missing project icon source'}
          $sourcePath=(Resolve-Path -LiteralPath 'src/windows/Dyclokpro_Perfiles_Locales.cs').Path
          & $csc /nologo /target:winexe /platform:x64 /optimize+ "/out:$manager" /reference:System.Windows.Forms.dll /reference:System.Drawing.dll $sourcePath
          if($LASTEXITCODE -ne 0){throw 'Local profile manager C# compilation failed'}
          $bytes=[System.IO.File]::ReadAllBytes($manager)
          if($bytes.Length -lt 20000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90){
            throw 'Invalid local profile executable'
          }
          Write-Host ('LOCAL_MANAGER_EXE_SHA256='+ (Get-FileHash $manager -Algorithm SHA256).Hash.ToLowerInvariant())

      - name: Assemble v6.2 from verified v6.1 and test local helper
        shell: pwsh
        run: |
          $original=Join-Path $env:RUNNER_TEMP 'Dyclokpro_6.1_win_x64.exe'
          $app=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-2-prepackaged'
          $helper=Join-Path $env:RUNNER_TEMP 'Dyclokpro_Perfiles_Locales.exe'
          & python tools/release-v6-2-local.py --installer $original --output $app --helper $helper
          if($LASTEXITCODE -ne 0){throw 'v6.2 complete app assembly or Chromium verification failed'}
          $local=Join-Path $app 'Dyclokpro_Perfiles_Locales.exe'
          & $local --self-test
          if($LASTEXITCODE -ne 0){throw 'Local manager cannot resolve its packaged Chromium executable'}
          if(Test-Path (Join-Path $app 'SourceData')){throw 'Bundled private profiles prohibited'}
          if(Test-Path (Join-Path $app 'Chromium\User Data')){throw 'Bundled Chromium user data prohibited'}
          Copy-Item -LiteralPath (Join-Path $app 'Dyclokpro.ico') -Destination 'release-build/v6.2/Dyclokpro.ico' -Force

      - name: Build installable Dyclokpro 6.2 Windows x64 NSIS EXE
        shell: pwsh
        working-directory: release-build/v6.2
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          & npm install --no-fund --no-audit --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'Failed to prepare NSIS package builder'}
          $app=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-2-prepackaged'
          & npx electron-builder --win nsis --x64 --prepackaged $app --publish never --config electron-builder.json
          if($LASTEXITCODE -ne 0){throw 'Windows installer build failed'}
          $exe='out/Dyclokpro_6.2_win_x64.exe'
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'NSIS installer not found'}
          $size=(Get-Item -LiteralPath $exe).Length
          if($size -lt 180000000){throw "Installer unexpectedly small: $size"}
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          "$hash  Dyclokpro_6.2_win_x64.exe" | Set-Content 'out/SHA256SUMS_v6.2.txt' -Encoding ascii
          Write-Host "DYCLOKPRO_V6_2_EXE_BYTES=$size"
          Write-Host "DYCLOKPRO_V6_2_SHA256=$hash"

      - name: Validate installer and publish immutable v6.2 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='release-build/v6.2/out/Dyclokpro_6.2_win_x64.exe'
          $sum='release-build/v6.2/out/SHA256SUMS_v6.2.txt'
          $hash=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if((Get-Content $sum -Raw).Trim() -ne "$hash  Dyclokpro_6.2_win_x64.exe"){
            throw 'Installer SHA256 sums mismatch'
          }
          $stream=[System.IO.File]::OpenRead((Resolve-Path $exe).Path)
          try{
            $head=New-Object byte[] 2
            if($stream.Read($head,0,2) -ne 2 -or $head[0] -ne 77 -or $head[1] -ne 90){
              throw 'Not a Windows EXE'
            }
          }finally{$stream.Dispose()}
          & 7z l $exe | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Windows EXE archive validation failed'}
          $notes=@'
          # Dyclokpro v6.2 — Perfiles locales independientes

          Instalador completo Windows x64. Conserva la aplicacion y Chromium de v6.1.

          - Nuevo programa independiente **Dyclokpro_Perfiles_Locales.exe**, incluido en la instalacion.
          - Acceso desde Inicio > Dyclokpro > Perfiles locales.
          - Crea nuevos perfiles locales, cada uno en una carpeta aislada bajo %LOCALAPPDATA%\Dyclokpro\LocalProfiles.
          - Inicia Chromium desde la instalacion mediante --user-data-dir. No utiliza el token de bloqueo del servicio original.
          - Bloqueo local de la apertura simultanea del mismo perfil mientras el lanzador permanece activo.
          - Los perfiles administrados por DICloak siguen utilizando el flujo remoto de v6.1.
          - Se mantiene desactivada la actualizacion automatica del programa introducida en v5.9.
          - Nombre visible e icono Dyclokpro conservados.

          **Limitaciones importantes:**
          - No se ha implementado la sincronizacion/importacion automatica de cookies, proxy, IndexedDB o configuraciones desde el servidor del proveedor.
          - No desbloquea perfiles remotos existentes ni reutiliza tokens antiguos.
          - Los nuevos perfiles locales mantienen sus propios datos despues de cerrar correctamente Chromium.
          - No se han validado sesiones de usuario reales en una PC de destino: la prueba del lanzador valida la presencia del navegador; no sustituye abrir la interfaz del navegador.
          - Conserva un respaldo antes de instalar. Los datos de perfiles privados no se incluyen en el paquete.
          '@
          & gh release create 'v6.2' $exe $sum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Dyclokpro v6.2 - Perfiles locales independientes' --notes $notes --latest
          if($LASTEXITCODE -ne 0){throw 'Could not publish v6.2 Windows Release'}
          Write-Host 'DYCLOKPRO_V6_2_PUBLICACION_GITHUB=OK'

name: DyclokPRO v6.5 - Nuevo icono nombre y ruta Windows

on:
  push:
    branches:
      - 'release/v6.5-dyclokpro-branding'
    paths:
      - '.github/workflows/publish-v6-5-branding-windows.yml'
      - 'tools/release-v6-5-brand.py'
      - 'release-build/v6.5/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dyclokpro-v6-5-branding-release
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.repository == 'luis5afp/Dyclokpropio'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout user supplied icon and v6.5 sources
        uses: actions/checkout@v4

      - name: Refuse to overwrite existing v6.5 version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $published=@(& gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'Could not enumerate published versions'}
          if(@($published | Where-Object {$_.tagName -eq 'v6.5'}).Count -gt 0){
            throw 'BLOCKED: v6.5 already published, do not replace historical releases'
          }

      - name: Retrieve and SHA256-verify full v6.4 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh release download 'v6.4' --repo $env:GITHUB_REPOSITORY --pattern 'Dyclokpro_6.4_win_x64.exe' --dir $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){throw 'Failed to retrieve complete v6.4 installer'}
          $source=Join-Path $env:RUNNER_TEMP 'Dyclokpro_6.4_win_x64.exe'
          if(-not(Test-Path -LiteralPath $source -PathType Leaf)){throw 'Original v6.4 EXE missing'}
          $actual=(Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash.ToLowerInvariant()
          if($actual -ne 'dc92c2ea4f21f32d172a181c8d2c8734803273f238c61724b4f757c1a4830384'){
            throw 'BLOCKED: original v6.4 release checksum mismatch'
          }
          Write-Host 'PREVIOUS_FULL_INSTALLER_SHA256_VERIFIED=true'

      - name: Install Pillow for icon conversion
        shell: pwsh
        run: |
          & python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          if($LASTEXITCODE -ne 0){throw 'Pillow image conversion install failed'}

      - name: Replace Windows icon, app title and every branded SVG PNG ICO asset
        shell: pwsh
        run: |
          $original=Join-Path $env:RUNNER_TEMP 'Dyclokpro_6.4_win_x64.exe'
          $dest=Join-Path $env:RUNNER_TEMP 'DyclokPRO-v6.5-prepackaged'
          & python tools/release-v6-5-brand.py --installer $original --destination $dest --icon 'release-build/v6.5/DyclokPRO_icon.png' --brand-js 'release-build/v6.5/visible-brand.js'
          if($LASTEXITCODE -ne 0){throw 'BLOCKED: branding or ASAR integrity check failed'}
          foreach($required in @('DICloak.exe','DyclokPRO.ico','Dyclokpro_Perfiles_Locales.exe',
            'Chromium/Application/ginsbrowser.exe','Chromium/Application/142.0.7444.273/chrome.dll',
            'resources/app.asar','resources/app.asar.unpacked/dist/dyclokpro-v65-brand.js',
            'resources/app.asar.unpacked/dist/dyclokpro-archive.js')){
            if(-not(Test-Path -LiteralPath (Join-Path $dest $required) -PathType Leaf)){
              throw "Required component missing: $required"
            }
          }
          if(Test-Path -LiteralPath (Join-Path $dest 'SourceData')){throw 'Private profile files must not ship'}
          if(Test-Path -LiteralPath (Join-Path $dest 'Chromium/User Data')){throw 'Private browser user data must not ship'}
          Copy-Item -LiteralPath (Join-Path $dest 'DyclokPRO.ico') -Destination 'release-build/v6.5/DyclokPRO.ico' -Force

      - name: Install Windows packaging dependencies
        shell: pwsh
        working-directory: release-build/v6.5
        run: |
          & npm install --no-audit --no-fund --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'Windows NSIS build dependency failure'}

      - name: Set actual Windows EXE embedded icon and product branding
        shell: pwsh
        working-directory: release-build/v6.5
        run: |
          $exe=Join-Path $env:RUNNER_TEMP 'DyclokPRO-v6.5-prepackaged\DICloak.exe'
          $icon=(Resolve-Path -LiteralPath 'DyclokPRO.ico').Path
          & node patch-windows-exe.mjs $exe $icon
          if($LASTEXITCODE -ne 0){throw 'BLOCKED: cannot edit native Windows EXE icon'}
          $info=(Get-Item -LiteralPath $exe).VersionInfo
          Write-Host ("REBRANDED_PRODUCT_NAME="+$info.ProductName)
          Write-Host ("REBRANDED_FILE_DESCRIPTION="+$info.FileDescription)
          if($info.ProductName -ne 'DyclokPRO'){
            throw 'Windows executable still has a legacy product name'
          }

      - name: Build full DyclokPRO 6.5 Windows x64 NSIS installer
        shell: pwsh
        working-directory: release-build/v6.5
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $app=Join-Path $env:RUNNER_TEMP 'DyclokPRO-v6.5-prepackaged'
          & npx electron-builder --win nsis --x64 --prepackaged $app --publish never --config electron-builder.json
          if($LASTEXITCODE -ne 0){throw 'Could not build full installable Windows EXE'}
          $exe='out/DyclokPRO_6.5_win_x64.exe'
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'Generated installer missing'}
          if((Get-Item $exe).Length -lt 180000000){throw 'Generated installer is unexpectedly small'}
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          "$sha  DyclokPRO_6.5_win_x64.exe" | Set-Content 'out/SHA256SUMS_v6.5.txt' -Encoding ascii
          Write-Host "INSTALLER_SHA256=$sha"

      - name: Smoke-test actual installation location and Windows icon branding
        shell: pwsh
        run: |
          $exe=(Resolve-Path -LiteralPath 'release-build/v6.5/out/DyclokPRO_6.5_win_x64.exe').Path
          $installed=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO'
          if(Test-Path -LiteralPath $installed){throw 'Test runner already contains DyclokPRO; cannot validate clean path'}
          $proc=Start-Process -FilePath $exe -ArgumentList '/S' -PassThru -Wait
          if($proc.ExitCode -ne 0){throw "Silent NSIS installation failed with code $($proc.ExitCode)"}
          $internal=Join-Path $installed 'DICloak.exe'
          if(-not(Test-Path -LiteralPath $internal -PathType Leaf)){
            throw "Wrong installation directory: expected $installed"
          }
          $metadata=(Get-Item -LiteralPath $internal).VersionInfo
          if($metadata.ProductName -ne 'DyclokPRO'){throw 'Installed EXE has incorrect visible product name'}
          foreach($file in @('resources/app.asar','Chromium/Application/ginsbrowser.exe','Dyclokpro_Perfiles_Locales.exe')){
            if(-not(Test-Path -LiteralPath (Join-Path $installed $file) -PathType Leaf)){
              throw "Installed package incomplete: $file"
            }
          }
          $desktop=[Environment]::GetFolderPath('Desktop')
          $link=Join-Path $desktop 'DyclokPRO.lnk'
          if(-not(Test-Path -LiteralPath $link)){throw "Desktop shortcut not named DyclokPRO: $link"}
          $shortcut=(New-Object -ComObject WScript.Shell).CreateShortcut($link)
          if(-not($shortcut.TargetPath -ieq $internal)){
            throw "Desktop shortcut targets wrong file: $($shortcut.TargetPath)"
          }
          Write-Host "INSTALLATION_DIRECTORY_VERIFIED=$installed"
          Write-Host "DESKTOP_SHORTCUT_NAME=DyclokPRO"
          Write-Host "ICON_AND_WINDOWS_VERSION_METADATA_VERIFIED=true"

      - name: Publish only the fully verified DyclokPRO v6.5 EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer='release-build/v6.5/out/DyclokPRO_6.5_win_x64.exe'
          $sums='release-build/v6.5/out/SHA256SUMS_v6.5.txt'
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if((Get-Content $sums -Raw).Trim() -ne "$sha  DyclokPRO_6.5_win_x64.exe"){
            throw 'Installer digest and published sum are different'
          }
          $notes=@'
          # DyclokPRO v6.5 — Nuevo icono y nombre completo

          Instalador completo para Windows x64, compilado desde el v6.4 publicado.

          - Icono nuevo negro con figura blanca y estrellas verdes, proporcionado por el usuario.
          - Nuevo icono para el ejecutable Windows, acceso directo de escritorio y barra de tareas.
          - Recursos SVG, PNG e ICO internos, pantallas de acceso, logotipos y favicon actualizados.
          - Barra de titulo y etiquetas visibles: DyclokPRO (v6.5).
          - Nuevo nombre de accesos directos e instalador: DyclokPRO.
          - Ruta de instalacion de usuario verificada en Windows: %LOCALAPPDATA%\Programs\DyclokPRO
          - Se conserva el ejecutable tecnico DICloak.exe y la identidad interna de datos para
            mantener la compatibilidad con perfiles ya existentes, Chromium y sincronizacion.
          - Nuevo identificador de instalador para no redirigir a la ruta de versiones anteriores.
            Las aplicaciones instaladas anteriormente pueden quedar instaladas por separado.
          - Se conserva la actualizacion de archivo local original de v6.4 y el gestor de perfiles.
          - El programa sigue sin comprobar ni descargar actualizaciones automaticas.

          Verificaciones: hashes, estructura Electron ASAR, sintaxis JavaScript, icono y
          ProductName de Windows, instalador NSIS y prueba de instalacion silenciosa en
          %LOCALAPPDATA%\Programs\DyclokPRO con acceso directo de escritorio.
          La apertura real de perfiles debe validarse en el PC del usuario.
          No redistribuir perfiles privados; respaldar antes de instalar.
          '@
          & gh release create 'v6.5' $installer $sums --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'DyclokPRO v6.5 - Nuevo icono y nombre' --notes $notes --latest
          if($LASTEXITCODE -ne 0){throw 'GitHub release upload failed'}
          Write-Host 'DYCLOKPRO_V6_5_RELEASE_PUBLISHED=true'

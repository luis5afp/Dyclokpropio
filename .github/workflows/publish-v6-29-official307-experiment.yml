name: DyclokPRO v6.29 EXPERIMENT - genuine official 3.0.7 engine
on:
  push:
    branches: ['experiment/v6.29-official-307-runtime']
    paths:
      - '.github/workflows/publish-v6-29-official307-experiment.yml'
      - 'release-build/v6.29/**'
      - 'tools/release-v6-29-official307.py'
      - 'tools/test-v6-29-official307.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dyclokpro-v629-official307-experiment
  cancel-in-progress: false
jobs:
  build-publish:
    if: github.repository == 'luis5afp/Dyclokpropio'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refuse to overwrite release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing=@(& gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'Could not list releases'}
          if(@($existing | Where-Object {$_.tagName -eq 'v6.29'}).Count -gt 0){throw 'v6.29 already exists'}
      - name: Validate source and isolated account overlay
        shell: pwsh
        run: |
          & python -m py_compile tools/release-v6-29-official307.py
          if($LASTEXITCODE -ne 0){throw 'Python script invalid'}
          foreach($file in @('release-build/v6.29/overlay-main.js','release-build/v6.29/overlay-preload.js','release-build/v6.29/overlay-users.js','release-build/v6.29/patch-windows-exe.mjs')){
            & node --check $file
            if($LASTEXITCODE -ne 0){throw "Invalid script $file"}
          }
          & node tools/test-v6-29-official307.cjs
          if($LASTEXITCODE -ne 0){throw '3.0.7 guard and account test failed'}
          & node tools/test-v6-27-raw-archive.cjs
          if($LASTEXITCODE -ne 0){throw 'Archive regression test failed'}
      - name: Download verified DICloak 3.0.7
        shell: pwsh
        run: |
          $file=Join-Path $env:RUNNER_TEMP 'DICloak_3.0.7_win_x64.exe'
          Invoke-WebRequest -Uri 'https://cdn1.dicloak.net/app/release/prod/DICloak_3.0.7_win_x64.exe' -OutFile $file -TimeoutSec 900
          if(-not(Test-Path $file -PathType Leaf)){throw 'Official download failed'}
          $sha=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '01b412f603b1aeb0a9f479476d4dca2f1fe653c7d35b344a6fb59b45d1cc93ae'){
            throw "BLOCKED: 3.0.7 differs from user-provided installer ($sha)"
          }
          Write-Host 'VERIFIED_OFFICIAL_307=PASS'
      - name: Extract official engine and add independent DyclokPRO modules
        shell: pwsh
        run: |
          $installer=Join-Path $env:RUNNER_TEMP 'DICloak_3.0.7_win_x64.exe'
          $target=Join-Path $env:RUNNER_TEMP 'dyclokpro-629-prepackaged'
          & python tools/release-v6-29-official307.py --installer $installer --destination $target
          if($LASTEXITCODE -ne 0){throw 'Original engine did not verify'}
          if(Test-Path "$target\SourceData"){throw 'Private SourceData bundled'}
          if(Test-Path "$target\Chromium\User Data"){throw 'Private Chromium data bundled'}
          Copy-Item -LiteralPath 'application.ico' -Destination (Join-Path $target 'DyclokPRO.ico') -Force
          Copy-Item -LiteralPath 'application.ico' -Destination 'release-build/v6.29/DyclokPRO.ico' -Force
      - name: Build complete Windows NSIS EXE
        shell: pwsh
        working-directory: release-build/v6.29
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          & npm install --no-audit --no-fund --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'Builder dependencies failed'}
          $app=Join-Path $env:RUNNER_TEMP 'dyclokpro-629-prepackaged'
          $icon=(Resolve-Path DyclokPRO.ico).Path
          & node patch-windows-exe.mjs (Join-Path $app 'DICloak.exe') $icon
          if($LASTEXITCODE -ne 0){throw 'PE metadata failed'}
          & npx electron-builder --win nsis --x64 --prepackaged $app --publish never --config electron-builder.json
          if($LASTEXITCODE -ne 0){throw 'NSIS build failed'}
          $exe='out/DyclokPRO_6.29_win_x64.exe'
          if(-not(Test-Path $exe -PathType Leaf)){throw 'EXE not generated'}
          if((Get-Item $exe).Length -lt 140000000){throw 'EXE unexpectedly small'}
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  DyclokPRO_6.29_win_x64.exe" | Set-Content 'out/SHA256SUMS_v6.29.txt' -Encoding ascii
      - name: Verify Windows install and isolated Electron accounts
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'release-build/v6.29/out/DyclokPRO_6.29_win_x64.exe').Path
          $installPath=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO'
          if(Test-Path $installPath){throw 'Runner already has an installed copy'}
          $setup=Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          if($setup.ExitCode -ne 0){throw "Install failed: $($setup.ExitCode)"}
          $app=Join-Path $installPath 'DICloak.exe'
          if(-not(Test-Path $app -PathType Leaf)){throw 'Installed app missing'}
          $id='0123456789abcdef0123456789abcdef'
          $legacy=Join-Path $env:TEMP 'dyclokpro-v629-test-legacy.json'
          $second=Join-Path $env:TEMP "dyclokpro-v629-test-$id.json"
          foreach($f in @($legacy,$second)){if(Test-Path $f){Remove-Item $f -Force}}
          $one=Start-Process -FilePath $app -ArgumentList '--dyclok-self-test' -Wait -PassThru
          if($one.ExitCode -ne 0){throw 'Main account self-test failed'}
          $two=Start-Process -FilePath $app -ArgumentList "--dyclok-account=$id --dyclok-self-test" -Wait -PassThru
          if($two.ExitCode -ne 0){throw 'Second account self-test failed'}
          if(-not(Test-Path $legacy) -or -not(Test-Path $second)){throw 'Startup markers absent'}
          $a=Get-Content $legacy -Raw|ConvertFrom-Json
          $b=Get-Content $second -Raw|ConvertFrom-Json
          if($a.version -ne '3.0.7' -or $b.version -ne '3.0.7' -or $a.id -ne 'legacy' -or
             $b.id -ne $id -or $a.userData -eq $b.userData -or $a.sessionData -eq $b.sessionData){
            throw '3.0.7 app identity or account isolation failed'
          }
          Write-Host 'WINDOWS_INSTALL=PASS'
          Write-Host 'REAL_307_ENGINE_AND_TWO_ACCOUNTS=PASS'
          Write-Host 'REMOTE_LOGIN_PROFILE_LOADING=NOT_TESTED'
      - name: Publish experimental Windows EXE only after CI succeeds
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='release-build/v6.29/out/DyclokPRO_6.29_win_x64.exe'
          $sum='release-build/v6.29/out/SHA256SUMS_v6.29.txt'
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if((Get-Content $sum -Raw).Trim() -ne "$hash  DyclokPRO_6.29_win_x64.exe"){
            throw 'Checksum file mismatch'
          }
          $notes=@'
          # DyclokPRO v6.29 EXPERIMENTAL — motor oficial 3.0.7
          Esta version toma el instalador ORIGINAL de DICloak 3.0.7 y verifica
          SHA256 antes de extraerlo. Mantiene sus modulos de autenticacion,
          API, cabeceras firmadas y motor de navegador sin alteraciones.
          Agrega cuentas independientes por proceso y archivo automatico JSON
          sin cifrar como modulos separados. La interfaz usa panel lateral
          para abrir usuarios en VENTANAS SEPARADAS, no las pestanas de v6.27.
          Los datos anteriores en %LOCALAPPDATA%\DyclokPRO\Cuentas NO se borran.
          El motor nuevo guarda sus datos en la subcarpeta Engine307 por cuenta.
          CI verifica instalacion, version autentica 3.0.7 y dos cuentas aisladas.
          IMPORTANTE: NO verifica inicio de sesion remoto ni carga de perfiles;
          por eso NO se declara solucion estable. Respalde Cuentas y conserve
          el instalador funcional v6.27 antes de probar. Los JSON sin cifrar
          pueden incluir datos sensibles. No comparta la carpeta de archivos.
          '@
          & gh release create v6.29 $exe $sum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'DyclokPRO v6.29 - motor oficial 3.0.7 (EXPERIMENTAL)' --notes $notes --prerelease
          if($LASTEXITCODE -ne 0){throw 'GitHub release publish failed'}
          Write-Host 'DYCLOKPRO_V629_RELEASE=PASS'

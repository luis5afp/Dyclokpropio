name: DyclokPRO v6.36 - Windows installer from exact v6.28
on:
  push:
    branches:
      - 'fix/v6.36-desde-v6.28-base'
    paths:
      - '.github/workflows/publish-v6-28-version-ab.yml'
      - 'release-build/v6.36/**'
      - 'tools/release-v6-28-internal307-ab.py'
      - 'tools/test-v6-28-internal307.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dyclokpro-v636-experimental
  cancel-in-progress: false

jobs:
  build-publish:
    if: github.repository == 'luis5afp/Dyclokpropio'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout release sources
        uses: actions/checkout@v4

      - name: Do not overwrite existing published v6.36
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versions=@(& gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'Cannot list existing releases'}
          if(@($versions | Where-Object {$_.tagName -eq 'v6.36'}).Count -gt 0){
            throw 'BLOCKED: published v6.36 already exists'
          }

      - name: Check API bridge, archive filter and original NSIS packaging
        shell: pwsh
        run: |
          & python -m py_compile tools/release-v6-36-from-v628-compat.py
          if($LASTEXITCODE -ne 0){throw 'Python packaging failed'}
          foreach($file in @('release-build/v6.36/compat307-backend.js','release-build/v6.36/compat307-ui.js','release-build/v6.36/raw-archive-ui.js','release-build/v6.36/patch-windows-exe.mjs')){
            & node --check $file
            if($LASTEXITCODE -ne 0){throw "Syntax failure $file"}
          }
          & node tools/test-v6-36-compat307.cjs
          if($LASTEXITCODE -ne 0){throw 'Official Local API tests failed'}
          & node tools/test-v6-36-archive-300003.cjs
          if($LASTEXITCODE -ne 0){throw '300003 legacy archive regression test failed'}

      - name: Download verified original v6.28 release (no old build recompile)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh release download v6.28 --repo $env:GITHUB_REPOSITORY --pattern 'DyclokPRO_6.28_win_x64.exe' --dir $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){throw 'Original v6.28 EXE unavailable'}
          $file=Join-Path $env:RUNNER_TEMP 'DyclokPRO_6.28_win_x64.exe'
          $hash=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '954016364fe3e4c1a41b54d810388f8ca79d67a184d3ad25993b74c2d2b1c606'){throw 'Original v6.28 SHA256 mismatch'}
          Write-Host 'EXACT_V628_SOURCE_INSTALLER=PASS'

      - name: Preserve v6.28 original UI, sessions, Chromium and archive; add companion
        shell: pwsh
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'DyclokPRO_6.28_win_x64.exe'
          $dest=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-36-prepackaged'
          & python tools/release-v6-36-from-v628-compat.py --installer $src --destination $dest
          if($LASTEXITCODE -ne 0){throw 'v6.28 package/auth integrity failed'}
          Copy-Item (Join-Path $dest 'DyclokPRO.ico') -Destination 'release-build/v6.36/DyclokPRO.ico' -Force
          foreach($relative in @('SourceData','Chromium/User Data')){
            if(Test-Path (Join-Path $dest $relative)){throw "Private profile folder bundled: $relative"}
          }
          if(-not(Test-Path (Join-Path $dest 'Chromium/Application/ginsbrowser.exe'))){throw 'Original Chromium missing'}
          if(-not(Test-Path (Join-Path $dest 'Dyclokpro_Perfiles_Locales.exe'))){throw 'Local profiles helper missing'}
          Write-Host 'ORIGINAL_V628_ACCOUNTS_PROFILE_MANAGER_CHROMIUM=PASS'

      - name: Build full Windows x64 NSIS installer
        shell: pwsh
        working-directory: release-build/v6.36
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          & npm install --no-audit --no-fund --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'Cannot install packager'}
          $app=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-36-prepackaged'
          $icon=(Resolve-Path -LiteralPath DyclokPRO.ico).Path
          & node patch-windows-exe.mjs (Join-Path $app 'DICloak.exe') $icon
          if($LASTEXITCODE -ne 0){throw 'PE branding failed'}
          & npx electron-builder --win nsis --x64 --prepackaged $app --publish never --config electron-builder.json
          if($LASTEXITCODE -ne 0){throw 'NSIS compile failed'}
          $exe='out/DyclokPRO_6.36_win_x64.exe'
          if(-not(Test-Path $exe -PathType Leaf)){throw 'EXE missing'}
          if((Get-Item $exe).Length -lt 180000000){throw 'Incomplete Chromium installer'}
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DyclokPRO_6.36_win_x64.exe" | Set-Content out/SHA256SUMS_v6.36.txt -Encoding ascii
          Write-Host "INSTALLER_SHA256=$hash"

      - name: Validate Windows installation and original isolated account data
        shell: pwsh
        run: |
          $installer=(Resolve-Path 'release-build/v6.36/out/DyclokPRO_6.36_win_x64.exe').Path
          $install=Join-Path $env:LOCALAPPDATA 'Programs\DyclokPRO'
          if(Test-Path -LiteralPath $install){throw 'Dirty Windows testing machine'}
          $setup=Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if($setup.ExitCode -ne 0){throw "Installer failed: $($setup.ExitCode)"}
          $app=Join-Path $install 'DICloak.exe'
          if(-not(Test-Path -LiteralPath $app -PathType Leaf)){throw 'Application missing after install'}
          if((Get-Item $app).VersionInfo.ProductName -ne 'DyclokPRO'){throw 'Windows product name incorrect'}
          $id='0123456789abcdef0123456789abcdef'
          $legacy=Join-Path $env:TEMP 'dyclokpro-v610-check-legacy.json'
          $isolated=Join-Path $env:TEMP "dyclokpro-v610-check-$id.json"
          foreach($f in @($legacy,$isolated)){if(Test-Path $f){Remove-Item $f -Force}}
          $one=Start-Process -FilePath $app -ArgumentList '--dyclok-self-test' -Wait -PassThru
          if($one.ExitCode -ne 0){throw 'Legacy account startup failed'}
          $two=Start-Process -FilePath $app -ArgumentList "--dyclok-account=$id --dyclok-self-test" -Wait -PassThru
          if($two.ExitCode -ne 0){throw 'Isolated account startup failed'}
          if(-not(Test-Path $legacy) -or -not(Test-Path $isolated)){throw 'Account test markers missing'}
          $a=Get-Content $legacy -Raw | ConvertFrom-Json
          $b=Get-Content $isolated -Raw | ConvertFrom-Json
          if($a.id -ne 'legacy' -or $b.id -ne $id -or $a.userData -eq $b.userData -or $a.sessionData -eq $b.sessionData){
            throw 'Electron accounts are not isolated'
          }
          $addon=Join-Path $install 'resources\app.asar.unpacked\dist\dyclokpro-compat307.js'
          if(-not(Test-Path $addon)){throw 'Optional official API panel missing'}
          $archive=Get-Content (Join-Path $install 'resources\app.asar.unpacked\dist\dyclokpro-archive.js') -Raw
          if(-not $archive.Contains('obj.code!==0')){throw 'Error code 300003 archive filter missing'}
          if(-not(Test-Path (Join-Path $install 'Chromium/Application/ginsbrowser.exe'))){throw 'Original Chromium not installed'}
          if(-not(Test-Path (Join-Path $install 'Dyclokpro_Perfiles_Locales.exe'))){throw 'Local profile manager not installed'}
          Write-Host 'V628_RUNTIME_AND_USERDATA=RETAINED'
          Write-Host 'LOCAL_OPEN_API_V1_V2_OPTIONAL=PASS'
          Write-Host 'API_300003_REJECTED_BY_ARCHIVE=PASS'
          Write-Host 'SECOND_ACCOUNT_ISOLATION=PASS'
          Write-Host 'REAL_SERVER_PROFILE_LOADING=NOT_TESTED'

      - name: Publish v6.36 candidate only after passing Windows checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='release-build/v6.36/out/DyclokPRO_6.36_win_x64.exe'
          $sum='release-build/v6.36/out/SHA256SUMS_v6.36.txt'
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if((Get-Content $sum -Raw).Trim() -ne "$hash  DyclokPRO_6.36_win_x64.exe"){throw 'Invalid installer checksum'}
          $notes=@'
          # DyclokPRO v6.36 — desde la base original v6.28

          PRE-RELEASE EXPERIMENTAL Windows x64. Proviene exactamente del
          instalador v6.28 publicado, verificado por SHA-256.
          Conserva cuentas, pestanas, interfaz, Chromium 142, perfiles
          locales y archivado de respuestas JSON de v6.28.

          NUEVO:
          - Panel lateral opcional "Motor oficial 3.0.7".
          - Consultas solo GET a la API local V1/V2 oficial con clave
            X-API-KEY proporcionada por el usuario.
          - Lista perfiles, detalles, version y capacidades declaradas
            por servicio local, sin tocar solicitudes de autenticacion.
          - Guarda opcionalmente JSON original sin reescribir ni cifrar.
          - Evita que el archivador original guarde respuestas rechazadas
            con code=300003 pese a HTTP 200.
          - Preserva el motor anterior 2.8.17 renombrado como 3.0.7
            por la prueba v6.28: NO incorpora el motor genuino 3.0.7.

          ATENCION: El cierre de sesion al cargar perfiles NO esta resuelto
          ni probado con un login real. El adaptador necesita un cliente
          DICloak oficial aparte, con su API local habilitada.
          Las consultas no permiten extraer automaticamente bases de datos
          completas de Chromium. El contenido JSON sin cifrar puede contener
          datos privados: proteja ArchivoOriginal y no lo comparta.
          RESPALDAR %LOCALAPPDATA%\DyclokPRO\Cuentas antes de instalar.
          Conservar el instalador v6.28 como opcion de regreso.
          '@
          & gh release create v6.36 $exe $sum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'DyclokPRO v6.36 - prueba interna 3.0.7 (candidato)' --notes $notes --prerelease
          if($LASTEXITCODE -ne 0){throw 'Cannot publish v6.36'}
          Write-Host 'DYCLOKPRO_V628_PUBLICATION=PASS'

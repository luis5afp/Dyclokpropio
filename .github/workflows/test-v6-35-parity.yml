name: DyclokPRO v6.35 - verify v6.28 functional compatibility with official 3.0.7
on:
  push:
    branches: ['feature/v6.35-legacy-parity-official307']
    paths:
      - '.github/workflows/test-v6-35-parity.yml'
      - 'release-build/v6.35/Launcher/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check external bridge stays read-only and original signed ASAR is never edited
        shell: pwsh
        run: |
          $files=@(
            'release-build/v6.35/Launcher/OfficialApiArchiveWindow.cs',
            'release-build/v6.35/Launcher/OfficialApiContract.cs',
            'release-build/v6.35/Launcher/Program.cs'
          )
          foreach($name in $files){if(-not (Test-Path $name)){throw "Source missing: $name"}}
          $source=Get-Content $files[0] -Raw
          if($source -notmatch '127.0.0.1:' -or $source -notmatch 'X-API-KEY'){
            throw 'Official Local API loopback authorization missing'
          }
          if($source -match 'HttpMethod\.(?:Post|Put|Patch|Delete)|X-DC-M1|X-DC-M2'){
            throw 'Blocked: signed provider headers or non-read-only API operation'
          }
          if($source -notmatch 'catch\(ProviderApiFailure ex\) when\(ex.ApiCode==300003\)'){
            throw 'Business error 300003 needs fail-closed behavior'
          }
          Write-Host 'ORIGINAL_SIGNED_PROVIDER_API=UNCHANGED'
      - name: Compile external DyclokPRO Windows manager and API contract
        shell: pwsh
        run: |
          $target=Join-Path $env:RUNNER_TEMP 'dyclokpro-v635-verify'
          & dotnet publish release-build/v6.35/Launcher/DyclokPRO.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o $target
          if($LASTEXITCODE -ne 0){throw 'DyclokPRO Windows compile failed'}
          $launcher=Join-Path $target 'DyclokPRO.exe'
          if(-not(Test-Path $launcher -PathType Leaf)){throw 'Launcher EXE not produced'}
          & $launcher '--dyclok-api-contract-test'
          if($LASTEXITCODE -ne 0){throw 'API contract test failed'}
          Write-Host 'PROFILE_ID_NAME_MAPPING=PASS'
          Write-Host 'HTTP200_BUSINESS_300003_REJECTED=PASS'
          Write-Host 'API_METADATA_REDACTION=PASS'
          Write-Host 'EXACT_JSON_BYTE_STORAGE_CONTRACT=PASS'
      - name: Retain test-only executable for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: v6.35-external-compatibility-test-only
          path: ${{ runner.temp }}\dyclokpro-v635-verify\DyclokPRO.exe
          retention-days: 7

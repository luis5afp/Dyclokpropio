name: Dyclokpro v6.4 - Archivo local de respuestas originales

on:
  push:
    branches:
      - 'release/v6.4-local-server-archive'
    paths:
      - '.github/workflows/publish-v6-4-server-archive.yml'
      - 'tools/release-v6-4-archive.py'
      - 'release-build/v6.4/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dyclokpro-v6-4-server-archive
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.repository == 'luis5afp/Dyclokpropio'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout v6.4 sources
        uses: actions/checkout@v4

      - name: Ensure v6.4 release does not exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags=@(& gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'Could not read GitHub Releases'}
          if(@($tags | Where-Object {$_.tagName -eq 'v6.4'}).Count -gt 0){
            throw 'BLOCKED: v6.4 already exists, refusing to overwrite'
          }

      - name: Download and verify complete v6.3 Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh release download v6.3 --repo $env:GITHUB_REPOSITORY --pattern 'Dyclokpro_6.3_win_x64.exe' --dir $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){throw 'Original v6.3 EXE could not be downloaded'}
          $exe=Join-Path $env:RUNNER_TEMP 'Dyclokpro_6.3_win_x64.exe'
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'Expected v6.3 EXE does not exist'}
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          if($sha -ne '0ee52c0749626fce99f691fd370f0cc30409334b45df35d6c19ba0603c538e39'){
            throw 'BLOCKED: original v6.3 SHA256 changed'
          }

      - name: Validate archive logic and compile JavaScript
        shell: pwsh
        run: |
          & node --check release-build/v6.4/archive.js
          if($LASTEXITCODE -ne 0){throw 'Invalid JavaScript in local archive'}
          $script=Get-Content -LiteralPath 'release-build/v6.4/archive.js' -Raw
          foreach($check in @('AES-GCM','PBKDF2','indexedDB.open','crypto.subtle.encrypt','crypto.subtle.decrypt',
            'response.clone().text()','archive','Dyclokpro_proxy_','Dyclokpro_')){
            if(-not $script.Contains($check)){throw "Missing required local archive component: $check"}
          }
          foreach($unsafe in @('sendBeacon(', 'document.cookie=', 'console.log(', 'localStorage.setItem(')){
            if($script.Contains($unsafe)){throw "Blocked unsafe logging/export pattern: $unsafe"}
          }
          Write-Host 'LOCAL_ARCHIVE_STATIC_CHECK=PASS'

      - name: Add encrypted persistent archive to verified Electron ASAR
        shell: pwsh
        run: |
          $exe=Join-Path $env:RUNNER_TEMP 'Dyclokpro_6.3_win_x64.exe'
          $root=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-4-prepackaged'
          & python tools/release-v6-4-archive.py --installer $exe --destination $root --archive release-build/v6.4/archive.js
          if($LASTEXITCODE -ne 0){throw 'BLOCKED: resource integrity validation or ASAR repackage failed'}
          foreach($rel in @('DICloak.exe','Dyclokpro_Perfiles_Locales.exe','Dyclokpro.ico',
            'Chromium/Application/ginsbrowser.exe',
            'Chromium/Application/142.0.7444.273/chrome.dll',
            'resources/app.asar',
            'resources/app.asar.unpacked/dist/dyclokpro-archive.js',
            'resources/app.asar.unpacked/dist/dyclokpro-inspector.js')){
            if(-not(Test-Path -LiteralPath (Join-Path $root $rel) -PathType Leaf)){
              throw "BLOCKED: required app component missing: $rel"
            }
          }
          if(Test-Path -LiteralPath (Join-Path $root 'SourceData')){throw 'Private profiles included'}
          if(Test-Path -LiteralPath (Join-Path $root 'Chromium/User Data')){throw 'Private browser data included'}
          Copy-Item -LiteralPath (Join-Path $root 'Dyclokpro.ico') -Destination 'release-build/v6.4/Dyclokpro.ico' -Force

      - name: Build real Windows x64 NSIS Dyclokpro v6.4 EXE
        shell: pwsh
        working-directory: release-build/v6.4
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          & npm install --no-audit --no-fund --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'Could not install NSIS packager'}
          $app=Join-Path $env:RUNNER_TEMP 'dyclokpro-v6-4-prepackaged'
          & npx electron-builder --win nsis --x64 --prepackaged $app --publish never --config electron-builder.json
          if($LASTEXITCODE -ne 0){throw 'Windows executable packaging failed'}
          $exe='out/Dyclokpro_6.4_win_x64.exe'
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'Missing generated installer'}
          $bytes=(Get-Item $exe).Length
          if($bytes -lt 180000000){throw "BLOCKED: installer unexpectedly small: $bytes"}
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          "$hash  Dyclokpro_6.4_win_x64.exe" | Set-Content 'out/SHA256SUMS_v6.4.txt' -Encoding ascii
          Write-Host "DYCLOKPRO_V6_4_INSTALLER_BYTES=$bytes"
          Write-Host "DYCLOKPRO_V6_4_INSTALLER_SHA256=$hash"

      - name: Validate installable EXE and publish immutable GitHub Release v6.4
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='release-build/v6.4/out/Dyclokpro_6.4_win_x64.exe'
          $sums='release-build/v6.4/out/SHA256SUMS_v6.4.txt'
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          if((Get-Content $sums -Raw).Trim() -ne "$hash  Dyclokpro_6.4_win_x64.exe"){
            throw 'Installer checksum file does not match'
          }
          $stream=[System.IO.File]::OpenRead((Resolve-Path $exe).Path)
          try {
            $magic=New-Object byte[] 2
            if($stream.Read($magic,0,2) -ne 2 -or $magic[0] -ne 77 -or $magic[1] -ne 90){
              throw 'Installer does not have a Windows EXE header'
            }
          }finally{$stream.Dispose()}
          & 7z l $exe | Out-Null
          if($LASTEXITCODE -ne 0){throw 'NSIS installer compressed package is invalid'}
          $notes=@'
          # Dyclokpro v6.4 - Archivo local de respuestas originales

          Instalador completo Windows 64 bits actualizado desde v6.3.

          - Boton inferior izquierdo **Archivo local - Cookies y Proxy**.
          - Historial local persistente de metadatos de las respuestas HTTP observadas por Dyclokpro.
          - Al activar el archivo con una contrasena local (minimo 12 caracteres),
            las nuevas respuestas HTTP observadas se guardan con su texto original cifrado mediante AES-GCM.
          - El archivador no modifica las peticiones ni las respuestas del servidor.
          - Exportacion explicita de las respuestas originales observadas por categoria:
            cookies en JSON, proxy en TXT, configuracion y parametros en JSON.
          - Ninguna contrasena de cifrado se transmite al proveedor ni se almacena como texto plano.
          - Los archivos exportados por decision del usuario estan descifrados y pueden incluir
            credenciales/sesiones: guardarlos en un lugar privado y no subirlos a repositorios.
          - La copia original solo existe para respuestas observadas despues de activar el archivo;
            los registros antiguos conservan un indice sin el texto original.
          - Se conserva Dyclokpro v6.3, Chromium 142, el gestor de perfiles locales y la
            desactivacion de comprobacion automatica de actualizaciones.
          - Los perfiles remotos siguen utilizando su bloqueo y autorizacion existentes.

          Limitaciones: solo puede observar respuestas HTTP fetch/XHR de la interfaz
          Electron de Dyclokpro. No extrae datos del proceso ginsbrowser.exe ni
          de todos los procesos secundarios; no garantiza recopilar todos los datos
          sincronizados del servidor. Ningun perfil/cookie de usuario se incluye en el EXE.

          Compilacion de JavaScript, integridad de app.asar, presencia de Chromium,
          empaquetado NSIS y SHA256 verificados automaticamente. Uso con datos reales
          y apertura grafica del panel no comprobados en la PC de destino.
          '@
          & gh release create 'v6.4' $exe $sums --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Dyclokpro v6.4 - Archivo local de respuestas originales' --notes $notes --latest
          if($LASTEXITCODE -ne 0){throw 'Uploading the v6.4 installer failed'}
          Write-Host 'DYCLOKPRO_V6_4_RELEASE_PUBLISHED=true'
